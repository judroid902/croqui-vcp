<body><title>Croqui de Vistoria</title>
<style>
/* Layout: barra escura no topo, trilho de ferramentas à esquerda (embaixo no celular), prancheta quadriculada ocupando o resto */
:root {
  --top-bg:#17212B; --top-pill:#233140; --top-fg:#FFFFFF; --top-muted:#B8C1CC; --top-on-bg:#FFFFFF; --top-on-fg:#17212B;
  --bg:#F3F4F1; --surface:#FFFFFF; --soft:#F7F8F5; --line:#D5D9D2; --muted:#4A5562; --fg:#17212B;
  --blue:#1F4FB8; --blue-bg:#E3EBFB; --blue-tint:#F5F8FE; --on-blue:#FFFFFF;
  --orange:#B54708; --orange-bg:#FDF0E3; --green:#1B7A3D; --green-bg:#E2F2E7; --red:#B42318; --red-bg:#FCEBEA;
  --paper:#FBFBF8; --grid-minor:#DFE5EB; --grid-major:#A7B4C2; --wall:#17212B; --dim:#5B6673;
  --room-fill:rgba(27,122,61,.06); --room-fill-sel:rgba(31,79,184,.12); --room-stroke:#1B7A3D; --sel:#1F4FB8; --note:#9A3D06;
  --c-varanda:#B54708; --c-calcada:#6B7280; --c-permeavel:#2E7D32; --c-piscina:#1A7FB5; --c-piso:#7A3FB8;
  --ghost:#8C99A6; --ghost-fill:#CBD3DB;
  --scrim:rgba(10,15,20,.45); --shadow:0 8px 28px rgba(23,33,43,.18);
  --font:Roboto, "Segoe UI", system-ui, sans-serif; --mono:"Roboto Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --top-bg:#0A0F14; --top-pill:#1C2733; --top-fg:#FFFFFF; --top-muted:#9DA9B6; --top-on-bg:#E7ECF1; --top-on-fg:#0A0F14;
  --bg:#0F151B; --surface:#1A232D; --soft:#151D25; --line:#2E3B48; --muted:#9DA9B6; --fg:#E7ECF1;
  --blue:#86A9F5; --blue-bg:#1D2C4A; --blue-tint:#18243A; --on-blue:#0A0F14;
  --orange:#F2A15F; --orange-bg:#3A2412; --green:#5CC487; --green-bg:#16301F; --red:#F08A80; --red-bg:#3A1A17;
  --paper:#11181F; --grid-minor:#1D2731; --grid-major:#364553; --wall:#E7ECF1; --dim:#9DA9B6;
  --room-fill:rgba(92,196,135,.07); --room-fill-sel:rgba(134,169,245,.16); --room-stroke:#5CC487; --sel:#86A9F5; --note:#F2A15F;
  --c-varanda:#F2A15F; --c-calcada:#A3ACB8; --c-permeavel:#6FCF87; --c-piscina:#5BB8F0; --c-piso:#C39BF5;
  --ghost:#5D6C7A; --ghost-fill:#2A3642;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"] {
  --top-bg:#0A0F14; --top-pill:#1C2733; --top-fg:#FFFFFF; --top-muted:#9DA9B6; --top-on-bg:#E7ECF1; --top-on-fg:#0A0F14;
  --bg:#0F151B; --surface:#1A232D; --soft:#151D25; --line:#2E3B48; --muted:#9DA9B6; --fg:#E7ECF1;
  --blue:#86A9F5; --blue-bg:#1D2C4A; --blue-tint:#18243A; --on-blue:#0A0F14;
  --orange:#F2A15F; --orange-bg:#3A2412; --green:#5CC487; --green-bg:#16301F; --red:#F08A80; --red-bg:#3A1A17;
  --paper:#11181F; --grid-minor:#1D2731; --grid-major:#364553; --wall:#E7ECF1; --dim:#9DA9B6;
  --room-fill:rgba(92,196,135,.07); --room-fill-sel:rgba(134,169,245,.16); --room-stroke:#5CC487; --sel:#86A9F5; --note:#F2A15F;
  --c-varanda:#F2A15F; --c-calcada:#A3ACB8; --c-permeavel:#6FCF87; --c-piscina:#5BB8F0; --c-piso:#C39BF5;
  --ghost:#5D6C7A; --ghost-fill:#2A3642;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); overflow:hidden;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
button { font:inherit; color:inherit; touch-action:manipulation; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
input, textarea { font:inherit; user-select:text; -webkit-user-select:text; }
svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

#app { height:100%; display:flex; flex-direction:column; }

/* ---------- barra superior ---------- */
.topbar { flex:none; height:56px; display:flex; align-items:center; gap:8px; background:var(--top-bg); color:var(--top-fg);
  padding-left:max(10px, env(safe-area-inset-left, 0px)); padding-right:max(10px, env(safe-area-inset-right, 0px)); }
.tb-btn { width:42px; height:42px; border-radius:21px; border:none; background:var(--top-pill); color:var(--top-fg);
  display:inline-flex; align-items:center; justify-content:center; flex:none; }
.tb-btn:disabled { opacity:.35; cursor:default; }
.tb-btn.ghost { background:none; }
.tb-title { display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:none; margin-right:6px;
  background:none; border:none; color:inherit; text-align:left; padding:2px 8px 2px 4px; border-radius:10px; }
.tb-title:hover { background:var(--top-pill); }
.tb-title b { font-size:16px; line-height:1.2; }
.tb-title span { font-size:12px; color:var(--top-muted); white-space:nowrap; }
.floors { flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.floors::-webkit-scrollbar { display:none; }
.floor { height:36px; padding:0 14px; border-radius:18px; border:none; background:var(--top-pill); color:var(--top-muted);
  white-space:nowrap; font-size:14px; font-weight:500; flex:none; }
.floor.on { background:var(--top-on-bg); color:var(--top-on-fg); }
.floor.add { width:36px; padding:0; font-size:20px; line-height:1; }
.tb-pill { height:42px; padding:0 16px 0 12px; border-radius:21px; border:none; background:var(--top-pill); color:var(--top-fg);
  display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; flex:none; white-space:nowrap; }
.tb-pill.accent { background:var(--top-on-bg); color:var(--top-on-fg); }

/* ---------- área principal ---------- */
.main { flex:1; min-height:0; display:flex; }
.rail { flex:none; width:82px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column;
  gap:2px; padding:6px 5px; overflow-y:auto; }
.tool { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:58px; padding:5px 2px;
  border:none; border-radius:14px; background:none; color:var(--muted); font-size:11.5px; font-weight:500; flex:none; }
.tool svg.i { width:26px; height:26px; }
.tool.on { background:var(--blue-bg); color:var(--blue); }
/* cantinho indica que a ferramenta abre uma lista de opções */
.tool.pk::after { content:''; position:absolute; right:7px; bottom:7px; border:4px solid transparent;
  border-right-color:currentColor; border-bottom-color:currentColor; opacity:.55; }
.rail .sep { height:1px; background:var(--line); margin:3px 8px; flex:none; }
.stage { flex:1; min-width:0; position:relative; overflow:hidden; background:var(--paper); }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

.hint { position:absolute; left:12px; top:12px; max-width:min(480px, calc(100% - 24px)); background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:13px; line-height:1.4; color:var(--muted);
  box-shadow:var(--shadow); pointer-events:none; }
.hint b { color:var(--fg); font-weight:600; }
.chainbar { position:absolute; left:12px; top:var(--chain-top, 70px); display:flex; gap:8px; flex-wrap:wrap; align-items:center; max-width:calc(100% - 24px); }
.chainbar .seg { background:var(--surface); box-shadow:var(--shadow); }
.chainbar .seg button { height:42px; padding:0 16px; }
.bl { position:absolute; left:12px; bottom:12px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; max-width:calc(100% - 84px); }
.scale { display:flex; align-items:flex-end; gap:8px; font-size:12px; color:var(--muted); font-family:var(--mono);
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px 10px; }
.scale i { display:block; height:8px; border:2px solid var(--fg); border-top:none; }
.notice { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--orange-bg); color:var(--fg);
  border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px; font-size:13px; }
.notice b { color:var(--orange); }
.notice.info { background:var(--surface); box-shadow:var(--shadow); }
.notice.info b { color:var(--fg); }
.zoom { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
.zoom button { width:46px; height:46px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }

.btn { height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  font-weight:500; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
.btn.sm { height:36px; padding:0 12px; font-size:13px; }
.btn.primary { background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
.btn.danger { color:var(--red); border-color:var(--red-bg); background:var(--red-bg); }
.btn.shadow { box-shadow:var(--shadow); }
.btn:disabled { opacity:.45; cursor:default; }
.grow { flex:1; }

/* ---------- lista de opções da ferramenta (sobe a partir do trilho) ---------- */
.picker { position:absolute; z-index:26; left:10px; width:min(340px, calc(100% - 20px)); max-height:calc(100% - 20px); overflow:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:6px;
  display:flex; flex-direction:column; gap:2px; }
.pk-title { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px 4px; }
.pk-opt { display:flex; align-items:center; gap:12px; min-height:54px; padding:6px 10px; border:none; border-radius:12px;
  background:none; color:var(--fg); text-align:left; }
.pk-opt:hover { background:var(--soft); }
.pk-opt.on { background:var(--blue-bg); color:var(--blue); }
.pk-opt b { display:block; font-size:14.5px; font-weight:500; }
.pk-opt span { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
.pk-opt.on span { color:var(--blue); }
.sw { width:32px; height:22px; border-radius:5px; flex:none; position:relative; overflow:hidden; }
.sw.solid { background:var(--wall); }
.sw.hollow { border:3px solid var(--wall); background:var(--paper); }
.sw.reg::before { content:''; position:absolute; inset:0; background:currentColor; opacity:.25; }
.sw.reg { border:2px solid currentColor; }
@keyframes rise { from { transform:translateY(18px); opacity:0; } }
@media (prefers-reduced-motion: no-preference) { .picker { animation:rise .16s ease-out; } }

/* ---------- painel de edição ---------- */
.sheet { position:absolute; top:12px; right:12px; z-index:20; width:min(400px, calc(100% - 24px)); max-height:calc(100% - 24px);
  overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
  padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px; }
.sh-head { display:flex; align-items:flex-start; gap:10px; }
.sh-head > div { flex:1; min-width:0; }
.sh-title { font-size:17px; font-weight:700; }
.sh-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.x { width:40px; height:40px; border-radius:20px; border:none; background:var(--soft); color:var(--fg); display:flex;
  align-items:center; justify-content:center; flex:none; }
.lbl { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.field { display:flex; flex-direction:column; gap:6px; }
.row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  font-size:13.5px; font-variant-numeric:tabular-nums; }
.chip.on { background:var(--blue-bg); border-color:var(--blue); color:var(--blue); font-weight:600; }
.num { min-width:118px; height:48px; border-radius:12px; border:2px solid var(--line); background:var(--soft); color:var(--fg);
  font-family:var(--mono); font-size:20px; text-align:right; padding:0 12px; font-variant-numeric:tabular-nums; }
.num.on { border-color:var(--blue); background:var(--blue-tint); }
.num.sm { min-width:92px; height:42px; font-size:17px; }
.unit { font-family:var(--mono); color:var(--muted); font-size:15px; }
.keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.keys button { height:46px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:var(--fg);
  font-family:var(--mono); font-size:19px; }
.keys button:active { background:var(--blue-bg); }
.seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.seg button { flex:1; height:42px; border:none; background:var(--surface); color:var(--fg); font-size:14px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button.on { background:var(--blue-bg); color:var(--blue); font-weight:600; }
.divider { height:1px; background:var(--line); }
.small { font-size:12.5px; line-height:1.4; }
.muted { color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.stat { background:var(--soft); border-radius:10px; padding:8px 10px; min-width:0; }
.stat b { display:block; font-family:var(--mono); font-size:16px; font-weight:500; font-variant-numeric:tabular-nums; }
.stat span { font-size:11.5px; color:var(--muted); }
.txt { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 12px; background:var(--surface);
  color:var(--fg); font-size:16px; }
textarea.txt { height:76px; padding:10px 12px; resize:vertical; }
.fin-sum { background:var(--soft); border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.5; }
.fin-sum b { font-weight:600; }
.photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(74px, 1fr)); gap:6px; }
.photos:empty { display:none; }
.photos button { aspect-ratio:1; border:1px solid var(--line); border-radius:10px; padding:0; overflow:hidden; background:var(--soft); position:relative; }
.photos img { width:100%; height:100%; object-fit:cover; display:block; }
.photos i { position:absolute; left:4px; top:4px; font-style:normal; font-size:11px; font-family:var(--mono); background:rgba(0,0,0,.65);
  color:#fff; border-radius:6px; padding:1px 5px; }
.viewer img { display:block; width:100%; max-height:58vh; object-fit:contain; border-radius:10px; background:#000; }

/* ---------- lista de ambientes ---------- */
.drawer { position:absolute; top:0; right:0; bottom:0; z-index:30; width:min(390px, 94%); background:var(--surface);
  border-left:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; }
.dr-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
.dr-body { flex:1; overflow:auto; padding:8px 8px 16px; }
.dr-group { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:12px 10px 2px; }
.room-item { width:100%; display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; text-align:left;
  padding:11px 10px; border:none; border-radius:12px; background:none; color:var(--fg); }
.room-item:active, .room-item:hover { background:var(--soft); }
.room-item b { font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.room-item span { font-family:var(--mono); font-size:13.5px; font-variant-numeric:tabular-nums; }
.room-item .pd { color:var(--muted); }
.dr-sum { margin:8px 10px 0; padding:12px; background:var(--soft); border-radius:12px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; }
.dr-sum div { display:flex; justify-content:space-between; gap:12px; }
.dr-sum span:last-child { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--green); }
.empty { padding:24px 12px; color:var(--muted); font-size:14px; line-height:1.5; }

/* ---------- janelas sobrepostas ---------- */
.scrim { position:fixed; inset:0; z-index:50; background:var(--scrim); display:flex; align-items:center; justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal { width:100%; max-width:600px; max-height:100%; overflow:auto; background:var(--surface); border-radius:18px;
  padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); }
.modal h2 { margin:0; font-size:19px; text-wrap:balance; }
.ex-opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
.ex-opt { display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:12px; border-radius:14px;
  border:1px solid var(--line); background:var(--soft); color:var(--fg); min-width:0; }
.ex-opt b { font-size:15px; }
.ex-opt span { font-size:12.5px; color:var(--muted); line-height:1.35; }
.ex-out img { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; }
.ex-out textarea { width:100%; height:150px; font-family:var(--mono); font-size:11.5px; border:1px solid var(--line);
  border-radius:10px; padding:8px; background:var(--soft); color:var(--fg); }
.ex-out { display:flex; flex-direction:column; gap:8px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-grid .span2 { grid-column:1 / -1; }
.form-grid .row { flex-wrap:nowrap; }
.form-grid input[type="date"] { min-width:0; flex:1; }
.rail-end { margin-top:auto; display:flex; flex-direction:column; }
.tool.danger { color:var(--red); }
.btn.danger-solid { background:var(--red); border-color:var(--red); color:var(--on-blue); }
.menu button.danger { color:var(--red); }
.menu .sep { height:1px; background:var(--line); margin:4px 6px; }
.help { margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; font-size:14px; line-height:1.45; }
.menu { position:absolute; z-index:60; top:52px; right:max(10px, env(safe-area-inset-right, 0px)); background:var(--surface);
  border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; min-width:220px; }
.menu button { text-align:left; height:46px; padding:0 14px; border:none; border-radius:10px; background:none; color:var(--fg); font-size:15px; }
.menu button:hover { background:var(--soft); }
.toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:70;
  background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; max-width:calc(100% - 32px);
  box-shadow:var(--shadow); }

@media (max-width: 719px) {
  .main { flex-direction:column-reverse; }
  .rail { width:auto; flex-direction:row; border-right:none; border-top:1px solid var(--line); overflow-x:auto; overflow-y:hidden;
    padding:4px max(6px, env(safe-area-inset-right, 0px)) 4px max(6px, env(safe-area-inset-left, 0px)); }
  .tool { flex:1 0 66px; min-height:54px; font-size:10.5px; }
  .tool svg.i { width:24px; height:24px; }
  .rail .sep, .rail-end { display:none; }
  .form-grid { grid-template-columns:1fr; }
  .tb-title span, .tb-pill .lbl-t { display:none; }
  .tb-pill { padding:0 11px; }
  .hint { font-size:12.5px; }
  .picker { width:auto; right:10px; }
}
@media (max-width: 460px) {
  .tb-title, #bBack { display:none; }
  .topbar { gap:5px; }
  .tb-btn, .tb-pill { width:38px; height:38px; padding:0; justify-content:center; }
  .notice { font-size:12.5px; padding:6px 6px 6px 10px; }
}
@media (prefers-reduced-motion: no-preference) { .tool, .chip, .btn { transition:background-color .12s, color .12s; } }
</style>

<div id="app">
  <header class="topbar">

  teto: ['Laje pintada', 'Forro de gesso', 'Gesso rebaixado', 'Forro de PVC', 'Forro de madeira', 'Laje aparente', 'Telha aparente (sem forro)'],
  calcada: ['Concreto', 'Intertravado', 'Pedra portuguesa', 'Cerâmica antiderrapante', 'Cimentado', 'Pedra', 'Paralelepípedo'],
  permeavel: ['Grama', 'Terra', 'Brita', 'Vegetação/jardim', 'Piso drenante', 'Concregrama']
};

function finKeys(r) {

}
const finOpts = (r, k) => k === 'piso' && (r.cat === 'calcada' || r.cat === 'permeavel') ? FIN[r.cat] : FIN[k];
const POOL_REV = ['Alvenaria + azulejo', 'Alvenaria + pastilha', 'Concreto armado + pastilha', 'Concreto + pintura', 'Vinil (bolsão)', 'Fibra de vidro', 'Pré-moldada'];

const SECS = {
  quadrada: { n: 'Pilar quadrado', b: 0.2, h: 0.2, rot: 0 },
  retangular: { n: 'Pilar retangular', b: 0.2, h: 0.4, rot: 0 },
  circular: { n: 'Pilar circular', b: 0.25, h: 0.25, rot: 0 },
  U: { n: 'Perfil U', b: 0.075, h: 0.15, rot: 0 },
  H: { n: 'Perfil H', b: 0.15, h: 0.15, rot: 90 },
  I: { n: 'Perfil I', b: 0.1, h: 0.2, rot: 0 }
};
const SEC_IC = {
  quadrada: '<rect x="7" y="7" width="10" height="10" fill="currentColor" stroke="none"/>',
  retangular: '<rect x="8.5" y="4" width="7" height="16" fill="currentColor" stroke="none"/>',
  circular: '<circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/>',
  U: '<path d="M17 5H8v14h9" stroke-width="2.8"/>',
  H: '<path d="M6 5v14M18 5v14M6 12h12" stroke-width="2.8"/>',
  I: '<path d="M7 5h10M7 19h10M12 5v14" stroke-width="2.8"/>'
};
const MATS = ['Concreto', 'Metal', 'Madeira', 'Alvenaria'];
const colLabel = (c, i) => `P${i + 1}`;
const colDims = c => c.sec === 'circular' ? `Ø ${fmt(c.b * 100, 0)} cm` : c.sec === 'quadrada' ? `${fmt(c.b * 100, 0)}×${fmt(c.b * 100, 0)} cm` : `${fmt(c.b * 100, 0)}×${fmt(c.h * 100, 0)} cm`;

/* ================= estado ================= */
let doc, tool = 'editar', sel = null, chain = null, amb = null, pend = null, hover = null, S = null;
let curve = false, wallType = 'ceramico', regCat = 'interno', colSec = 'quadrada', acabMode = 'amb';
const cam = { ox: 0, oy: 0, z: 70 };
const undoStack = [], redoStack = [];
const F = () => doc.floors[doc.cur];
const newFloor = name => ({ id: uid(), name, v: {}, walls: [], ops: [], rooms: [], notes: [], cols: [] });
const pad2 = n => String(n).padStart(2, '0');
const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const brDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const DES_KEY = KEY + '-desenhista';
function lastDesenhista() { try { return localStorage.getItem(DES_KEY) || ''; } catch (e) { return ''; } }
const blankDoc = () => ({ ficha: '', desenhista: lastDesenhista(), data: isoToday(), title: '', pd: 2.6, cur: 0, example: false, showUnder: true, floors: [newFloor('Térreo')] });
// desenhos salvos pela versão anterior ganham os campos novos com os valores padrão
function migrate(d) {
  d.ficha = d.ficha || ''; d.desenhista = d.desenhista ?? lastDesenhista(); d.data = d.data || isoToday();
  if (d.showUnder == null) d.showUnder = true;
  for (const f of d.floors) {
    f.cols = f.cols || []; f.notes = f.notes || []; f.ops = f.ops || [];
    for (const w of f.walls) { if (!w.th) w.th = TH; if (!w.type) w.type = 'ceramico'; }
    for (const r of f.rooms) { r.cat = r.cat || 'interno'; r.fin = r.fin || {}; r.photos = r.photos || []; if (r.pd == null) r.pd = d.pd || 2.6; }
  }
  return d;
}

function commit() { undoStack.push(JSON.stringify(doc)); if (undoStack.length > 150) undoStack.shift(); redoStack.length = 0; }
function restore(json) { doc = JSON.parse(json); chain = null; amb = null; pend = null; sel = null; S = null; $('#sheet').hidden = true; save(); refresh(); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(doc)); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(doc)); restore(redoStack.pop()); }
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(doc)); } catch (e) {} }, 300); }

/* ================= geometria ================= */
function wallGeom(f, w) {
  const A = f.v[w.a], B = f.v[w.b], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1e-9;
  return { A, B, L, ux: dx / L, uy: dy / L, nx: -dy / L, ny: dx / L };
}
function projSeg(p, A, B) {
  const dx = B.x - A.x, dy = B.y - A.y, L2 = dx * dx + dy * dy || 1e-12;
  const t = ((p.x - A.x) * dx + (p.y - A.y) * dy) / L2, tc = clamp(t, 0, 1);
  const x = A.x + dx * tc, y = A.y + dy * tc;
  return { t, x, y, d: Math.hypot(p.x - x, p.y - y) };
}
// Curva = arco entre A e B; s é a flecha (distância do meio da corda até o arco), com sinal pelo lado.
function arcInfo(A, B, s) {
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1e-9, n = { x: -dy / L, y: dx / L };
  const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }, as = Math.abs(s) || 1e-9, sg = s < 0 ? -1 : 1;
  const R = (L * L / 4 + as * as) / (2 * as), k = s - sg * R;
  return { L, n, M, R, sg, C: { x: M.x + n.x * k, y: M.y + n.y * k }, sweep: 4 * Math.atan(2 * as / L), apex: { x: M.x + n.x * s, y: M.y + n.y * s } };
}
function arcPts(A, B, s, N) {
  const a = arcInfo(A, B, s), k = N || clamp(Math.ceil(a.sweep * 14), 6, 72), vx = A.x - a.C.x, vy = A.y - a.C.y, out = [];
  for (let i = 0; i <= k; i++) {
    const ph = -a.sg * a.sweep * i / k, c = Math.cos(ph), sn = Math.sin(ph);
    out.push({ x: a.C.x + vx * c - vy * sn, y: a.C.y + vx * sn + vy * c });
  }
  out[0] = pt(A); out[k] = pt(B);
  return out;
}
const sFromR = (L, R, sg) => sg * (R - Math.sqrt(Math.max(0, R * R - L * L / 4)));
function arcLen(A, B, s) { const a = arcInfo(A, B, s); return a.R * a.sweep; }
function polyArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function polyPerim(p) { let s = 0; for (let i = 0; i < p.length; i++) s += dist(p[i], p[(i + 1) % p.length]); return s; }
function polyCentroid(p) {
  const A = polyArea(p);
  if (Math.abs(A) < 1e-9) return { x: p.reduce((s, q) => s + q.x, 0) / p.length, y: p.reduce((s, q) => s + q.y, 0) / p.length };
  let cx = 0, cy = 0;
  for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length], k = a.x * b.y - b.x * a.y; cx += (a.x + b.x) * k; cy += (a.y + b.y) * k; }
  return { x: cx / (6 * A), y: cy / (6 * A) };
}
function pointInPoly(q, p) {
  let ins = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const a = p[i], b = p[j];
    if ((a.y > q.y) !== (b.y > q.y) && q.x < (b.x - a.x) * (q.y - a.y) / (b.y - a.y) + a.x) ins = !ins;
  }
  return ins;
}
// lados da região: curvos quando desenhados assim ou quando seguem uma parede curva
function roomEdges(f, r) {
  const ids = r.poly, n = ids.length;
  return ids.map((id, i) => {
    const j = ids[(i + 1) % n]; let s = (r.bul && r.bul[i]) || 0;
    if (!s) { const w = f.walls.find(w => w.s && ((w.a === id && w.b === j) || (w.a === j && w.b === id))); if (w) s = w.a === id ? w.s : -w.s; }
    return { A: f.v[id], B: f.v[j], s };
  });
}
function roomPts(f, r) {
  if (!r.poly.length || !r.poly.every(id => f.v[id])) return [];
  const out = [];
  for (const e of roomEdges(f, r)) { if (e.s) out.push(...arcPts(e.A, e.B, e.s).slice(0, -1)); else out.push(pt(e.A)); }
  return out;
}
function roomInfo(f, r) {
  const p = roomPts(f, r), area = Math.abs(polyArea(p));
  return { pts: p, area, per: polyPerim(p), c: p.length >= 3 ? polyCentroid(p) : null };
}
const roomName = (f, r) => r.name || (r.cat && r.cat !== 'interno' ? catOf(r).short : `Ambiente ${f.rooms.filter(x => x.cat === 'interno').indexOf(r) + 1}`);
function opGeom(f, o) {
  const w = f.walls.find(x => x.id === o.wall); if (!w) return null;
  const g = wallGeom(f, w);
  return { g, w, p0: { x: g.A.x + g.ux * o.t, y: g.A.y + g.uy * o.t }, p1: { x: g.A.x + g.ux * (o.t + o.w), y: g.A.y + g.uy * (o.t + o.w) } };
}
function wallDist(f, wl, q) {
  const A = f.v[wl.a], B = f.v[wl.b];
  if (!wl.s) return projSeg(q, A, B).d;
  const a = arcInfo(A, B, wl.s), ang = Math.atan2(q.y - a.C.y, q.x - a.C.x), am = Math.atan2(a.apex.y - a.C.y, a.apex.x - a.C.x);
  let d = Math.abs(ang - am); if (d > Math.PI) d = 2 * Math.PI - d;
  return d <= a.sweep / 2 + 1e-6 ? Math.abs(dist(q, a.C) - a.R) : Math.min(dist(q, A), dist(q, B));
}
function floorCenter(f) {
  const vs = Object.values(f.v); if (!vs.length) return { x: 0, y: 0 };
  return { x: vs.reduce((s, v) => s + v.x, 0) / vs.length, y: vs.reduce((s, v) => s + v.y, 0) / vs.length };
}
function bounds(f) {
  const xs = [], ys = [], add = p => { xs.push(p.x); ys.push(p.y); };
  Object.values(f.v).forEach(add);
  f.notes.forEach(add);
  (f.cols || []).forEach(c => { const r = Math.max(c.b, c.h || c.b) / 2; add({ x: c.x - r, y: c.y - r }); add({ x: c.x + r, y: c.y + r }); });
  f.walls.forEach(w => { if (w.s && f.v[w.a] && f.v[w.b]) add(arcInfo(f.v[w.a], f.v[w.b], w.s).apex); });
  f.rooms.forEach(r => { if (r.bul && r.bul.some(Boolean)) roomPts(f, r).forEach(add); });
  if (!xs.length) return null;
  return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) };
}

/* ================= modelo: vértices, paredes, aberturas ================= */
function findVertex(f, p) { for (const id in f.v) if (same(f.v[id], p)) return id; return null; }
function getOrCreateVertex(p, split = true) {
  const f = F(); let id = findVertex(f, p); if (id) return id;
  id = uid(); f.v[id] = pt(p);
  if (split) for (const w of f.walls) {
    if (w.s) continue;
    const g = wallGeom(f, w), pr = projSeg(p, g.A, g.B);
    if (pr.d < 1e-4 && pr.t > 1e-4 && pr.t < 1 - 1e-4) { splitWall(f, w, id, pr.t * g.L); break; }
  }
  return id;
}
function splitWall(f, w, id, at) {
  const w2 = { id: uid(), a: id, b: w.b, th: w.th, type: w.type };
  if (w.fin) w2.fin = Object.assign({}, w.fin);
  w.b = id; delete w.measured; delete w.note;
  f.walls.push(w2);
  for (const o of f.ops) if (o.wall === w.id && o.t >= at - 1e-6) { o.wall = w2.id; o.t -= at; }
}
const newWall = (a, b) => ({ id: uid(), a, b, th: TH, type: wallType });
function addWall(p1, p2) {
  const f = F(), a = getOrCreateVertex(p1), b = getOrCreateVertex(p2); if (a === b) return;
  const A = f.v[a], B = f.v[b], wallV = new Set(f.walls.flatMap(w => [w.a, w.b])), mids = [];
  for (const id of wallV) {
    if (id === a || id === b) continue;
    const pr = projSeg(f.v[id], A, B);
    if (pr.d < 1e-4 && pr.t > 1e-4 && pr.t < 1 - 1e-4) mids.push([pr.t, id]);
  }
  mids.sort((m, n) => m[0] - n[0]);
  const seq = [a, ...mids.map(m => m[1]), b];
  for (let i = 0; i < seq.length - 1; i++) {
    const x = seq[i], y = seq[i + 1];

  const last = d.pts[d.pts.length - 1], closes = same(d.pts[0], t);
  if (tool === 'parede') {
    commit(); if (s) addArcWall(last, t, s); else addWall(last, t); doc.example = false; save();
    if (closes) { const pts = d.pts; chain = null; onLoopClosed(pts); return; }
    d.pts.push(pt(t));
  } else {
    d.bul[d.pts.length - 1] = s;
    if (closes) { finishAmb(); return; }
    d.pts.push(pt(t));
  }
}
const newRoom = (poly, cat, bul) => Object.assign({ id: uid(), poly, cat, name: '', pd: doc.pd || 2.6, obs: '', fin: {}, photos: [] },
  cat === 'piscina' ? { prof: 1.4, rev: '' } : {}, bul && bul.some(Boolean) ? { bul } : {});
function onLoopClosed(pts) {
  const f = F(), poly = pts.map(p => findVertex(f, p)).filter(Boolean);

  const key = [...poly].sort().join();
  if (f.rooms.some(r => [...r.poly].sort().join() === key)) { toast('Contorno fechado.'); return; }
  const r = newRoom(poly, 'interno');

}
function chainBack() {

}
function finishAmb() {
  if (!amb) return;
  const n = amb.pts.length, bul = amb.pts.map((_, i) => amb.bul[i] || 0);
  if (n < 3 && !(n === 2 && bul.some(Boolean))) return;
  commit();
  const f = F(), r = newRoom(amb.pts.map(p => getOrCreateVertex(p, false)), amb.cat, bul);
  f.rooms.push(r); amb = null; pend = null; doc.example = false; save();
  if (r.cat === 'piso') openFinSheet('room', r.id, true); else openRoomSheet(r.id, true);
  updateUI();
}

function onTap(p, hit) {
  const w = toWorld(p), f = F();
  if (tool === 'editar') {
    if (!hit) { closeSheet(); return; }
    if (hit.type === 'wall') openWallSheet(hit.id);
    else if (hit.type === 'op') openOpSheet(hit.id);
    else if (hit.type === 'room') openRoomSheet(hit.id);
    else if (hit.type === 'note') openNoteSheet(hit.id);
    else if (hit.type === 'col') openColSheet(hit.id);
  } else if (tool === 'porta' || tool === 'janela') insertOpNear(tool, w);
  else if (tool === 'nota') openNoteSheet(null, w);
  else if (tool === 'elementos') {
    const h = hitTest(p, { noVertex: true });
    if (h && h.type === 'col') { openColSheet(h.id); return; }
    const s = snap(p, { noWall: true }), d = SECS[colSec];
    commit();
    const cl = { id: uid(), x: s.x, y: s.y, sec: colSec, b: d.b, h: d.h, rot: d.rot, mat: colSec === 'quadrada' || colSec === 'retangular' || colSec === 'circular' ? 'Concreto' : 'Metal', obs: '' };
    f.cols.push(cl); doc.example = false; save();
    openColSheet(cl.id, true);
  } else if (tool === 'acab') {
    if (acabMode === 'parede') {
      const bw = nearestWall(f, w, 32);
      if (!bw) { toast('Toque sobre uma parede.'); return; }
      openFinSheet('wall', bw.id);
    } else {
      const r = roomAt(f, w);
      if (!r) { toast('Toque dentro de um ambiente.'); return; }
      if (finKeys(r).length) openFinSheet('room', r.id); else openRoomSheet(r.id);
    }
  }
}

function insertOpNear(type, w) {
  const f = F(), bw = nearestWall(f, w, 32);

function insertOpOnWall(type, wallId, at) {
  const f = F(), wl = f.walls.find(x => x.id === wallId), g = wallGeom(f, wl);
  const pos = at ? (at.x - g.A.x) * g.ux + (at.y - g.A.y) * g.uy : g.L / 2;
  let width = type === 'porta' ? 0.8 : 1.2; if (width > g.L - 0.1) width = Math.max(0.3, g.L - 0.1);
  const cen = floorCenter(f), side = at ? ((at.x - g.A.x) * g.nx + (at.y - g.A.y) * g.ny) : ((cen.x - g.A.x) * g.nx + (cen.y - g.A.y) * g.ny);
  commit();
  const o = { id: uid(), wall: wallId, type, w: width, t: clamp(Math.round((pos - width / 2) / 0.05) * 0.05, 0, g.L - width),
    h: type === 'porta' ? 2.1 : 1.2, hinge: 0, side: side < 0 ? -1 : 1 };

function moveOpTo(id, w) {
  const f = F(), o = f.ops.find(x => x.id === id), G2 = opGeom(f, o); if (!G2) return;
  const g = G2.g, pos = (w.x - g.A.x) * g.ux + (w.y - g.A.y) * g.uy;
  o.t = clamp(Math.round((pos - o.w / 2) / 0.05) * 0.05, 0, Math.max(0, g.L - o.w));
}

/* ================= fotos (guardadas no aparelho, fora do desenho) ================= */
const idb = (() => {
  let dbp = null; const mem = new Map();
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const q = indexedDB.open('croqui-fotos', 1); q.onupgradeneeded = () => q.result.createObjectStore('fotos'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }
    catch (e) { rej(e); }
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('fotos', mode), q = fn(t.objectStore('fotos'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  }));
  // sem IndexedDB (navegador restrito), as fotos ficam só enquanto a página estiver aberta
  return {
    get: id => run('readonly', s => s.get(id)).catch(() => mem.get(id)),
    put: (id, v) => run('readwrite', s => s.put(v, id)).catch(() => { mem.set(id, v); }),
    del: id => run('readwrite', s => s.delete(id)).catch(() => { mem.delete(id); }),
    keys: () => run('readonly', s => s.getAllKeys()).catch(() => [...mem.keys()])
  };
})();
const phURL = {};
let photoTarget = null;
async function photoURL(id) {
  if (phURL[id]) return phURL[id];
  const v = await idb.get(id); if (!v) return null;
  return (phURL[id] = URL.createObjectURL(v.blob));
}
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob: b, w, h }) : rej(new Error('jpeg')), 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}
async function addPhotos(files) {
  const rid = photoTarget; if (!files.length || !rid) return;
  toast(files.length > 1 ? `Guardando ${files.length} fotos…` : 'Guardando foto…');
  const added = [];
  for (const file of files) {
    try { const v = await shrinkPhoto(file), id = uid() + uid(); await idb.put(id, v); added.push({ id, cap: '' }); }
    catch (e) { toast('Não foi possível ler uma das fotos.'); }
  }
  const f = doc.floors.find(fl => fl.rooms.some(r => r.id === rid)), r = f && f.rooms.find(x => x.id === rid);
  if (!r || !added.length) return;
  if (S && S.kind === 'room' && S.id === rid) touch(); else commit();
  r.photos.push(...added); doc.example = false; save(); render();
  if (S && S.kind === 'room' && S.id === rid) renderPhotos(r);
  toast(added.length > 1 ? `${added.length} fotos adicionadas.` : 'Foto adicionada.');
}
for (const inp of ['#camIn', '#galIn']) $(inp).addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; addPhotos(fs); });
async function renderPhotos(r) {

// desenho do pavimento num quadro de W×H px, sem carimbo
function renderFloor(f, W, H, grid, M = {}) {
  const b = bounds(f); if (!b) return null;
  const bw = b.x1 - b.x0 + 2.4, bh = b.y1 - b.y0 + 2.4, z = Math.min(W / bw, H / bh);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  drawScene(c.getContext('2d'), { ox: W / 2 - (b.x0 + b.x1) / 2 * z, oy: H / 2 - (b.y0 + b.y1) / 2 * z, z, W, H }, LIGHT,
    Object.assign({ floor: f, grid, fs: M.fs || Math.max(1, z / 65) }, M));
  return { canvas: c, z };
}
function renderPNG(withGrid) {
  const f = F(), b = bounds(f); if (!b) return null;
  const bw = b.x1 - b.x0 + 2.4, bh = b.y1 - b.y0 + 2.4, z = Math.min(110, 3600 / Math.max(bw, bh)), fs = Math.max(1, z / 65);
  const W = Math.round(bw * z), Hd = Math.round(bh * z), foot = Math.round(88 * fs), H = Hd + foot;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  drawScene(x, { ox: (1.2 - b.x0) * z, oy: (1.2 - b.y0) * z, z, W, H: Hd }, LIGHT, { floor: f, grid: withGrid, fs });
  x.fillStyle = '#FFFFFF'; x.fillRect(0, Hd, W, foot);
  x.fillStyle = '#17212B'; x.fillRect(0, Hd, W, 2 * fs);
  text(x, fichaLine(), 16 * fs, Hd + 22 * fs, { font: `700 ${15 * fs}px ${FONT}`, color: '#17212B', align: 'left' });
  text(x, `${autorLine()} · ${areaLine(f)}`, 16 * fs, Hd + 45 * fs, { font: `500 ${12 * fs}px ${FONT}`, color: '#17212B', align: 'left' });
  text(x, 'Grade 0,5 m · cotas em metros (azul = conferida, * = anotada, cinza = estimada)',
    16 * fs, Hd + 66 * fs, { font: `${11 * fs}px ${FONT}`, color: '#4A5562', align: 'left' });
  // escala gráfica de 1 m
  x.fillStyle = '#17212B'; x.fillRect(W - 16 * fs - z, Hd + 40 * fs, z, 4 * fs);
  text(x, '1 m', W - 16 * fs - z / 2, Hd + 26 * fs, { font: `500 ${11 * fs}px ${MONO}`, color: '#17212B' });
  return c;
}

        const data = new Uint8Array(await v.blob.arrayBuffer()), s = Math.min(bw / v.w, bh / v.h), iw = v.w * s, ih = v.h * s;
        Pp.image(data, v.w, v.h, 28 + (bw - iw) / 2, top + (bh - ih) / 2, iw, ih);
      } else Pp.text('Arquivo da foto não encontrado neste aparelho.', 28, top + 20, 10, { italic: true });
      Pp.text(`Foto ${it.n} — ${it.room} · ${it.floor}`, 28, top + bh + 18, 10.5, { bold: true });
      wrapText(it.cap, 539, 9.5).slice(0, 2).forEach((l, j) => Pp.text(l, 28, top + bh + 32 + j * 12, 9.5));
    }
  }
  const when = new Date().toLocaleString('pt-BR');
  pages.forEach((p, i) => {
    p.line(28, p.h - 38, p.w - 28, p.h - 38, .5, '#B4C0CC');
    p.text(`Croqui de Vistoria · ${fichaLine(doc.floors[0]).split(' — ')[0]} · gerado em ${when}`, 28, p.h - 24, 8, { color: '#4A5562' });
    p.text(`Página ${i + 1} de ${pages.length}`, p.w - 28, p.h - 24, 8, { align: 'right', color: '#4A5562' });
  });
  return pdfDoc(pages);
}

function tryDownload(name, blob) {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  } catch (e) {}
}
let lastFile = null;
const canShare = file => { try { return !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { return false; } };
function fileButtons() {
  return `<div class="row"><button class="btn sm" data-mact="again">Baixar de novo</button>${lastFile && canShare(lastFile) ? '<button class="btn sm primary" data-mact="share">Compartilhar</button>' : ''}</div>`;
}
function deliver(name, blob) { lastFile = new File([blob], name, { type: blob.type }); tryDownload(name, blob); }
function openExport() {
  if (!doc.floors.some(f => bounds(f))) { toast('Desenhe algo antes de exportar.'); return; }
  const nPh = photoNumbers().list.length;
  openModal(`<h2>Exportar croqui</h2>
    ${dadosForm()}
    <label class="row small"><input type="checkbox" id="exGrid" checked> Incluir a grade no desenho</label>
    <div class="ex-opts">
      <button class="ex-opt" data-mact="png"><b>Imagem PNG</b><span>Pavimento ${esc(F().name)}, com carimbo. Sem fotos.</span></button>
      <button class="ex-opt" data-mact="pdf"><b>PDF</b><span>Todos os pavimentos, tabela de ambientes e acabamentos${nPh ? ` e as ${nPh} fotos identificadas` : ''}.</span></button>
      <button class="ex-opt" data-mact="dxf"><b>DXF</b><span>Abre no AutoCAD. Paredes na espessura, por tipo de parede, em camadas.</span></button>
      <button class="ex-opt" data-mact="json"><b>JSON</b><span>Dados estruturados para o app de vistoria.</span></button>
    </div>
    <div class="ex-out" id="exOut"></div>
    <div class="row"><span class="grow"></span><button class="btn" data-mact="close">Fechar</button></div>`, {
    png() {
      const c = renderPNG($('#exGrid').checked), url = c.toDataURL('image/png');
      c.toBlob(b => { if (!b) return; deliver(fileBase() + '.png', b); $('#exBtns').innerHTML = fileButtons(); }, 'image/png');
      $('#exOut').innerHTML = `<p class="small muted" style="margin:0">Se o download não começar, toque e segure na imagem para salvar.</p><div id="exBtns"></div><img alt="Croqui exportado" src="${url}">`;
    },
    async pdf(b) {
      b.disabled = true; $('#exOut').innerHTML = '<p class="small muted" style="margin:0">Gerando o PDF…</p>';
      try {
        const blob = await buildPDF($('#exGrid').checked);
        deliver(fileBase(true) + '.pdf', blob);
        $('#exOut').innerHTML = `<p class="small" style="margin:0">PDF pronto (${fmt(blob.size / 1048576, 1)} MB). Se o download não começar, use Compartilhar para mandar ao Drive, WhatsApp ou e-mail.</p>${fileButtons()}`;
      } catch (e) { $('#exOut').innerHTML = `<p class="small" style="margin:0;color:var(--red)">Não foi possível gerar o PDF: ${esc(e.message || e)}</p>`; }
      b.disabled = false;
    },
    dxf() { const s = buildDXF(); deliver(fileBase() + '.dxf', new Blob([latin1(s)], { type: 'application/dxf' })); showText(s, 'DXF'); },
    json() { const s = buildJSON(); deliver(fileBase() + '.json', new Blob([s], { type: 'application/json' })); showText(s, 'JSON'); },
    again() { if (lastFile) tryDownload(lastFile.name, lastFile); },
    share() { if (lastFile) navigator.share({ files: [lastFile], title: lastFile.name }).catch(() => {}); },
    copy() {
      const ta = $('#exTxt');
      (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Copiado.'))
        .catch(() => { ta.focus(); ta.select(); toast('Texto selecionado. Use Copiar do teclado.'); });
    }
  });
}
function showText(s, kind) {
  $('#exOut').innerHTML = `<p class="small muted" style="margin:0">Se o download não começar, use Compartilhar ou copie o conteúdo e salve como arquivo .${kind.toLowerCase()}.</p>
    ${fileButtons()}<textarea id="exTxt" readonly>${esc(s)}</textarea><div class="row"><button class="btn sm" data-mact="copy">Copiar ${kind}</button></div>`;
}
$('#bExport').addEventListener('click', openExport);

function buildExample() {
  doc = { ficha: 'EXEMPLO', desenhista: lastDesenhista(), data: isoToday(), title: 'Casa térrea com piscina', pd: 2.6, cur: 0, example: true, showUnder: true, floors: [newFloor('Térreo')] };
  const f = F(), keepType = wallType; wallType = 'ceramico';
  const W = pts => { for (let i = 0; i < pts.length - 1; i++) addWall({ x: pts[i][0], y: pts[i][1] }, { x: pts[i + 1][0], y: pts[i + 1][1] }); };
  W([[0, 0], [8.5, 0], [8.5, 7.5], [0, 7.5], [0, 0]]);
  W([[5, 0], [5, 4]]); W([[5, 2.5], [8.5, 2.5]]); W([[0, 4], [8.5, 4]]); W([[4, 4], [4, 7.5]]);
  wallType = keepType;
  const vid = (x, y) => { let id = findVertex(f, { x, y }); if (!id) { id = uid(); f.v[id] = { x, y }; } return id; };
  const R = (name, pd, pts, cat = 'interno', extra = {}) => { const r = Object.assign(newRoom(pts.map(([x, y]) => vid(x, y)), cat), { name, pd }, extra); f.rooms.push(r); return r; };
  R('Sala', 2.7, [[0, 0], [5, 0], [5, 4], [0, 4]], 'interno', { fin: { piso: 'Porcelanato', parede: 'Pintura látex', teto: 'Forro de gesso' } });
  R('Cozinha', 2.6, [[5, 0], [8.5, 0], [8.5, 2.5], [5, 2.5]], 'interno', { fin: { piso: 'Cerâmica', parede: 'Azulejo/cerâmica', teto: 'Laje pintada' } });
  R('Banheiro', 2.4, [[5, 2.5], [8.5, 2.5], [8.5, 4], [5, 4]]);
  R('Quarto 1', 2.6, [[0, 4], [4, 4], [4, 7.5], [0, 7.5]]);
  R('Quarto 2', 2.6, [[4, 4], [8.5, 4], [8.5, 7.5], [4, 7.5]]);
  R('Varanda', 2.6, [[0, -2.5], [5, -2.5], [5, 0], [0, 0]], 'varanda', { fin: { piso: 'Cerâmica' } });
  R('Passeio', 0, [[-1, -4.5], [16.5, -4.5], [16.5, -3.5], [-1, -3.5]], 'calcada', { fin: { piso: 'Intertravado' } });
  R('Piscina', 0, [[10.5, 1], [13.5, 1], [13.5, 4.5], [10.5, 4.5]], 'piscina', { prof: 1.4, rev: 'Alvenaria + pastilha', bul: [0, -1.75, 0, 0] });
  R('Jardim', 0, [[9.5, 6], [16.5, 6], [16.5, 7.5], [9.5, 7.5]], 'permeavel', { fin: { piso: 'Grama' } });
  f.cols.push({ id: uid(), x: 0, y: -2.5, sec: 'quadrada', b: 0.2, h: 0.2, rot: 0, mat: 'Concreto', obs: '' });
  f.cols.push({ id: uid(), x: 5, y: -2.5, sec: 'quadrada', b: 0.2, h: 0.2, rot: 0, mat: 'Concreto', obs: '' });
  const wallAt = (x, y) => f.walls.find(w => { const q = projSeg({ x, y }, f.v[w.a], f.v[w.b]); return q.d < 1e-4 && q.t > 0 && q.t < 1; });
  const O = (type, cx, cy, w, inside, extra = {}) => {
    const wl = wallAt(cx, cy), g = wallGeom(f, wl), pos = (cx - g.A.x) * g.ux + (cy - g.A.y) * g.uy;
    const side = inside ? ((inside[0] - cx) * g.nx + (inside[1] - cy) * g.ny < 0 ? -1 : 1) : 1;
    f.ops.push(Object.assign({ id: uid(), wall: wl.id, type, w, t: pos - w / 2, h: type === 'porta' ? 2.1 : 1.2, hinge: 0, side }, type === 'janela' ? { sill: 1.0 } : {}, extra));
  };
  O('porta', 1.5, 0, 0.9, [1.5, 1]);
  O('porta', 5, 1.2, 0.8, [6, 1.2]);
  O('porta', 5, 3.2, 0.7, [6, 3.2]);

  }
  const bottomQ2 = wallAt(6.25, 7.5); bottomQ2.note = 4.47;
  f.notes.push({ id: uid(), x: 2, y: 6.6, text: 'Mancha de umidade — foto 14' });

}
