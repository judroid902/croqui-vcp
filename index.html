<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17212B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body><title>Croqui de Vistoria</title>
<style>
/* Layout: barra escura no topo, trilho de ferramentas à esquerda (embaixo no celular), prancheta quadriculada ocupando o resto */
:root {
  --top-bg:#17212B; --top-pill:#233140; --top-fg:#FFFFFF; --top-muted:#B8C1CC; --top-on-bg:#FFFFFF; --top-on-fg:#17212B;
  --bg:#F3F4F1; --surface:#FFFFFF; --soft:#F7F8F5; --line:#D5D9D2; --muted:#4A5562; --fg:#17212B;
  --blue:#1F4FB8; --blue-bg:#E3EBFB; --blue-tint:#F5F8FE; --on-blue:#FFFFFF;
  --orange:#B54708; --orange-bg:#FDF0E3; --green:#1B7A3D; --green-bg:#E2F2E7; --red:#B42318; --red-bg:#FCEBEA;
  --paper:#FBFBF8; --grid-minor:#DFE5EB; --grid-major:#A7B4C2; --wall:#17212B; --dim:#5B6673;
  --room-fill:rgba(27,122,61,.06); --room-fill-sel:rgba(31,79,184,.12); --room-stroke:#1B7A3D; --sel:#1F4FB8; --note:#9A3D06;
  --c-varanda:#B54708; --c-calcada:#6B7280; --c-permeavel:#2E7D32; --c-piscina:#1A7FB5; --c-piso:#7A3FB8;
  --ghost:#8C99A6; --ghost-fill:#CBD3DB; --esgoto:#4F8A0B; --dren:#B4239E; --imp:#3F6E92;
  --scrim:rgba(10,15,20,.45); --shadow:0 8px 28px rgba(23,33,43,.18);
  --font:Roboto, "Segoe UI", system-ui, sans-serif; --mono:"Roboto Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --top-bg:#0A0F14; --top-pill:#1C2733; --top-fg:#FFFFFF; --top-muted:#9DA9B6; --top-on-bg:#E7ECF1; --top-on-fg:#0A0F14;
  --bg:#0F151B; --surface:#1A232D; --soft:#151D25; --line:#2E3B48; --muted:#9DA9B6; --fg:#E7ECF1;
  --blue:#86A9F5; --blue-bg:#1D2C4A; --blue-tint:#18243A; --on-blue:#0A0F14;
  --orange:#F2A15F; --orange-bg:#3A2412; --green:#5CC487; --green-bg:#16301F; --red:#F08A80; --red-bg:#3A1A17;
  --paper:#11181F; --grid-minor:#1D2731; --grid-major:#364553; --wall:#E7ECF1; --dim:#9DA9B6;
  --room-fill:rgba(92,196,135,.07); --room-fill-sel:rgba(134,169,245,.16); --room-stroke:#5CC487; --sel:#86A9F5; --note:#F2A15F;
  --c-varanda:#F2A15F; --c-calcada:#A3ACB8; --c-permeavel:#6FCF87; --c-piscina:#5BB8F0; --c-piso:#C39BF5;
  --ghost:#5D6C7A; --ghost-fill:#2A3642; --esgoto:#A3E635; --dren:#E879F9; --imp:#8DB7D8;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"] {
  --top-bg:#0A0F14; --top-pill:#1C2733; --top-fg:#FFFFFF; --top-muted:#9DA9B6; --top-on-bg:#E7ECF1; --top-on-fg:#0A0F14;
  --bg:#0F151B; --surface:#1A232D; --soft:#151D25; --line:#2E3B48; --muted:#9DA9B6; --fg:#E7ECF1;
  --blue:#86A9F5; --blue-bg:#1D2C4A; --blue-tint:#18243A; --on-blue:#0A0F14;
  --orange:#F2A15F; --orange-bg:#3A2412; --green:#5CC487; --green-bg:#16301F; --red:#F08A80; --red-bg:#3A1A17;
  --paper:#11181F; --grid-minor:#1D2731; --grid-major:#364553; --wall:#E7ECF1; --dim:#9DA9B6;
  --room-fill:rgba(92,196,135,.07); --room-fill-sel:rgba(134,169,245,.16); --room-stroke:#5CC487; --sel:#86A9F5; --note:#F2A15F;
  --c-varanda:#F2A15F; --c-calcada:#A3ACB8; --c-permeavel:#6FCF87; --c-piscina:#5BB8F0; --c-piso:#C39BF5;
  --ghost:#5D6C7A; --ghost-fill:#2A3642; --esgoto:#A3E635; --dren:#E879F9; --imp:#8DB7D8;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); overflow:hidden;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
button { font:inherit; color:inherit; touch-action:manipulation; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
input, textarea { font:inherit; user-select:text; -webkit-user-select:text; }
svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

#app { height:100%; display:flex; flex-direction:column; }

/* ---------- barra superior ---------- */
.topbar { flex:none; height:56px; display:flex; align-items:center; gap:8px; background:var(--top-bg); color:var(--top-fg);
  padding-left:max(10px, env(safe-area-inset-left, 0px)); padding-right:max(10px, env(safe-area-inset-right, 0px)); }
.tb-btn { width:42px; height:42px; border-radius:21px; border:none; background:var(--top-pill); color:var(--top-fg);
  display:inline-flex; align-items:center; justify-content:center; flex:none; }
.tb-btn:disabled { opacity:.35; cursor:default; }
.tb-btn.ghost { background:none; }
.tb-btn { position:relative; }
/* bolinha laranja: há alterações ainda não salvas */
.tb-btn.dirty::after { content:''; position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:5px;
  background:#F2A15F; border:2px solid var(--top-pill); }
.tb-title { display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:none; margin-right:6px;
  background:none; border:none; color:inherit; text-align:left; padding:2px 8px 2px 4px; border-radius:10px; }
.tb-title:hover { background:var(--top-pill); }
.tb-title b { font-size:16px; line-height:1.2; }
.tb-title span { font-size:12px; color:var(--top-muted); white-space:nowrap; }
.floors { flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.floors::-webkit-scrollbar { display:none; }
.floor { height:36px; padding:0 14px; border-radius:18px; border:none; background:var(--top-pill); color:var(--top-muted);
  white-space:nowrap; font-size:14px; font-weight:500; flex:none; }
.floor.on { background:var(--top-on-bg); color:var(--top-on-fg); }
.floor.add { width:36px; padding:0; font-size:20px; line-height:1; }
.tb-pill { height:42px; padding:0 16px 0 12px; border-radius:21px; border:none; background:var(--top-pill); color:var(--top-fg);
  display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; flex:none; white-space:nowrap; }
.tb-pill.accent { background:var(--top-on-bg); color:var(--top-on-fg); }

/* ---------- área principal ---------- */
.main { flex:1; min-height:0; display:flex; }
.rail { flex:none; width:82px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column;
  gap:2px; padding:6px 5px; overflow-y:auto; }
.tool { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:58px; padding:5px 2px;
  border:none; border-radius:14px; background:none; color:var(--muted); font-size:11.5px; font-weight:500; flex:none; }
.tool svg.i { width:26px; height:26px; }
.tool span { text-align:center; line-height:1.15; hyphens:manual; }
.tool.on { background:var(--blue-bg); color:var(--blue); }
/* cantinho indica que a ferramenta abre uma lista de opções */
.tool.pk::after { content:''; position:absolute; right:7px; bottom:7px; border:4px solid transparent;
  border-right-color:currentColor; border-bottom-color:currentColor; opacity:.55; }
.rail .sep { height:1px; background:var(--line); margin:3px 8px; flex:none; }
.stage { flex:1; min-width:0; position:relative; overflow:hidden; background:var(--paper); }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

.hint { position:absolute; left:12px; top:12px; max-width:min(480px, calc(100% - 88px)); background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:13px; line-height:1.4; color:var(--muted);
  box-shadow:var(--shadow); pointer-events:none; }
.hint b { color:var(--fg); font-weight:600; }
.chainbar { position:absolute; left:12px; top:var(--chain-top, 70px); display:flex; gap:8px; flex-wrap:wrap; align-items:center; max-width:calc(100% - 24px); }
.chainbar .seg { background:var(--surface); box-shadow:var(--shadow); }
.chainbar .seg button { height:42px; padding:0 16px; flex:none; }
.chainbar .seg { max-width:100%; overflow-x:auto; scrollbar-width:none; }
.bl { position:absolute; left:12px; bottom:12px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; max-width:calc(100% - 84px); }
.scale { display:flex; align-items:flex-end; gap:8px; font-size:12px; color:var(--muted); font-family:var(--mono);
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px 10px; }
.scale i { display:block; height:8px; border:2px solid var(--fg); border-top:none; }
.notice { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--orange-bg); color:var(--fg);
  border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px; font-size:13px; }
.notice b { color:var(--orange); }
.notice.info { background:var(--surface); box-shadow:var(--shadow); }
.notice.info b { color:var(--fg); }
.zoom { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
.zoom button { width:46px; height:46px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
/* bússola: mostra para que lado fica o norte real */
.north { position:absolute; right:12px; top:12px; z-index:5; width:54px; height:54px; border-radius:27px; border:1px solid var(--line);
  background:var(--surface); color:var(--fg); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; padding:0; }
.north svg { width:42px; height:42px; }
.north.unset { color:var(--muted); }

/* ---------- barra do modo hidrossanitário (logo acima do menu de ferramentas) ---------- */
.hbar { position:absolute; left:0; right:0; bottom:0; z-index:15; display:flex; align-items:center; gap:4px; padding:6px 8px;
  background:var(--surface); border-top:3px solid var(--sys, var(--esgoto)); overflow-x:auto; scrollbar-width:none; }
.hbar::-webkit-scrollbar { display:none; }
.hb-sys { display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 12px; border-radius:20px; flex:none;
  background:var(--soft); color:var(--fg); font-size:13.5px; font-weight:700; white-space:nowrap; }
.hb-sys i { width:12px; height:12px; border-radius:6px; background:var(--sys); }
.hb-btn { display:flex; align-items:center; gap:8px; height:50px; padding:0 14px; border:none; border-radius:12px; background:none;
  color:var(--muted); font-size:13.5px; font-weight:500; white-space:nowrap; flex:none; }
.hb-btn.on { background:var(--blue-bg); color:var(--blue); }
.hb-btn.close { margin-left:auto; color:var(--fg); }
.stage.hb .bl, .stage.hb .zoom { bottom:78px; }
.stage.hb .sheet { max-height:calc(100% - 96px); }
.dev-ic { width:34px; height:26px; flex:none; }

.btn { height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  font-weight:500; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
.btn.sm { height:36px; padding:0 12px; font-size:13px; }
.btn.primary { background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
.btn.danger { color:var(--red); border-color:var(--red-bg); background:var(--red-bg); }
.btn.shadow { box-shadow:var(--shadow); }
.btn:disabled { opacity:.45; cursor:default; }
.grow { flex:1; }

/* ---------- lista de opções da ferramenta (sobe a partir do trilho) ---------- */
.picker { position:absolute; z-index:26; left:10px; width:min(340px, calc(100% - 20px)); max-height:calc(100% - 20px); overflow:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:6px;
  display:flex; flex-direction:column; gap:2px; }
.pk-title { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px 4px; }
.pk-opt { display:flex; align-items:center; gap:12px; min-height:54px; padding:6px 10px; border:none; border-radius:12px;
  background:none; color:var(--fg); text-align:left; }
.pk-opt:hover { background:var(--soft); }
.pk-opt.on { background:var(--blue-bg); color:var(--blue); }
.pk-opt b { display:block; font-size:14.5px; font-weight:500; }
.pk-opt span { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
.pk-opt.on span { color:var(--blue); }
.sw { width:32px; height:22px; border-radius:5px; flex:none; position:relative; overflow:hidden; }
.sw.solid { background:var(--wall); }
.sw.hollow { border:3px solid var(--wall); background:var(--paper); }
.sw.reg::before { content:''; position:absolute; inset:0; background:currentColor; opacity:.25; }
.sw.reg { border:2px solid currentColor; }
/* ícones pequenos de tipo de parede e de esquadria, antes do nome */
.wic { width:40px; height:28px; flex:none; color:var(--fg); }
.pk-opt.on .wic { color:var(--blue); }
.pk-grp { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px 2px; border-top:1px solid var(--line); margin-top:4px; }
@keyframes rise { from { transform:translateY(18px); opacity:0; } }
@media (prefers-reduced-motion: no-preference) { .picker { animation:rise .16s ease-out; } }

/* ---------- painel de edição ---------- */
.sheet { position:absolute; top:12px; right:12px; z-index:20; width:min(400px, calc(100% - 24px)); max-height:calc(100% - 24px);
  overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
  padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px; }
.sh-head { display:flex; align-items:flex-start; gap:10px; }
.sh-head > div { flex:1; min-width:0; }
.sh-title { font-size:17px; font-weight:700; }
.sh-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.x { width:40px; height:40px; border-radius:20px; border:none; background:var(--soft); color:var(--fg); display:flex;
  align-items:center; justify-content:center; flex:none; }
.lbl { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.field { display:flex; flex-direction:column; gap:6px; }
.row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  font-size:13.5px; font-variant-numeric:tabular-nums; }
.chip.on { background:var(--blue-bg); border-color:var(--blue); color:var(--blue); font-weight:600; }
.num { min-width:118px; height:48px; border-radius:12px; border:2px solid var(--line); background:var(--soft); color:var(--fg);
  font-family:var(--mono); font-size:20px; text-align:right; padding:0 12px; font-variant-numeric:tabular-nums; }
.num.on { border-color:var(--blue); background:var(--blue-tint); }
.num.sm { min-width:92px; height:42px; font-size:17px; }
.unit { font-family:var(--mono); color:var(--muted); font-size:15px; }
.keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.keys button { height:46px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:var(--fg);
  font-family:var(--mono); font-size:19px; }
.keys button:active { background:var(--blue-bg); }
.seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.seg button { flex:1; height:42px; border:none; background:var(--surface); color:var(--fg); font-size:14px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button.on { background:var(--blue-bg); color:var(--blue); font-weight:600; }
.divider { height:1px; background:var(--line); }
.small { font-size:12.5px; line-height:1.4; }
.muted { color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.stat { background:var(--soft); border-radius:10px; padding:8px 10px; min-width:0; }
.stat b { display:block; font-family:var(--mono); font-size:16px; font-weight:500; font-variant-numeric:tabular-nums; }
.stat span { font-size:11.5px; color:var(--muted); }
.txt { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 12px; background:var(--surface);
  color:var(--fg); font-size:16px; }
textarea.txt { height:76px; padding:10px 12px; resize:vertical; }
.fin-sum { background:var(--soft); border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.5; }
.fin-sum b { font-weight:600; }
.photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(74px, 1fr)); gap:6px; }
.photos:empty { display:none; }
.photos button { aspect-ratio:1; border:1px solid var(--line); border-radius:10px; padding:0; overflow:hidden; background:var(--soft); position:relative; }
.photos img { width:100%; height:100%; object-fit:cover; display:block; }
.photos i { position:absolute; left:4px; top:4px; font-style:normal; font-size:11px; font-family:var(--mono); background:rgba(0,0,0,.65);
  color:#fff; border-radius:6px; padding:1px 5px; }
.viewer img { display:block; width:100%; max-height:58vh; object-fit:contain; border-radius:10px; background:#000; }
/* faixas de acabamento da parede, de baixo para cima */
.band { border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; background:var(--soft); }
.band-h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; }
.band-h b { font-size:14px; }
.band .chip { background:var(--surface); }
.band .chip.on { background:var(--blue-bg); }
.sheet .pk-opt { min-height:48px; border:1px solid transparent; }
.sheet .pk-opt.on { border-color:var(--blue); }
.devs { display:flex; flex-direction:column; gap:2px; }
/* opções com caixa de marcar: o texto longo quebra ao lado da caixa, não embaixo dela */
label.row { flex-wrap:nowrap; align-items:flex-start; }
label.row input[type="checkbox"] { flex:none; margin:2px 0 0; width:18px; height:18px; }
/* tabela de quantitativos */
.qt { width:100%; border-collapse:collapse; font-size:14px; }
.qt td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
.qt td small { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
.qt td.q { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; width:1%; }
.qt td.u { color:var(--muted); width:1%; white-space:nowrap; padding-left:6px; }
/* círculo do norte */
.dial { position:relative; width:220px; height:220px; margin:4px auto; border-radius:50%; border:1px dashed var(--line); }
.dial button { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:23px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); font-size:12px; font-weight:600; }
.dial button.on { background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
.dial svg { position:absolute; left:50%; top:50%; width:110px; height:110px; margin:-55px 0 0 -55px; color:var(--fg); }

/* ---------- lista de ambientes ---------- */
.drawer { position:absolute; top:0; right:0; bottom:0; z-index:30; width:min(390px, 94%); background:var(--surface);
  border-left:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; }
.dr-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
.dr-body { flex:1; overflow:auto; padding:8px 8px 16px; }
.dr-group { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:12px 10px 2px; }
.room-item { width:100%; display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; text-align:left;
  padding:11px 10px; border:none; border-radius:12px; background:none; color:var(--fg); }
.room-item:active, .room-item:hover { background:var(--soft); }
.room-item b { font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.room-item span { font-family:var(--mono); font-size:13.5px; font-variant-numeric:tabular-nums; }
.room-item .pd { color:var(--muted); }

      const sd = ((wm.x - cen.x) * g.nx + (wm.y - cen.y) * g.ny) >= 0 ? -1 : 1, off = hn + 9 * fs;

/* ---------- tubos, caixas e pontos de contribuição ---------- */

    c.globalAlpha = fade(p.sys); c.strokeStyle = c.fillStyle = col; c.lineWidth = lw;

    }

    }
  }

    const nd = H.n[id], it = nd.item, on = isSel('hnode', id), col = on ? P.sel : P[nd.sys], x = X(nd.x), y = Y(nd.y);
    c.globalAlpha = fade(nd.sys); c.strokeStyle = c.fillStyle = col;

      text(c, `${lbl[id]}${nm}`, x + r + 5 * fs, y - (ap ? 6 : 0) * fs, { font: `700 ${10.5 * fs}px ${FONT}`, color: col, halo: P.paper, haloW: 3, align: 'left' });

function drawOverlay(c) {
  const f = F(), z = cam.z, X = x => x * z + cam.ox, Y = y => y * z + cam.oy, P = PAL;
  const dot = (p, r, fill, stroke, w = 2) => { c.beginPath(); c.arc(X(p.x), Y(p.y), r, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = w; c.strokeStyle = stroke; c.stroke(); } };
  const ends = (g, moving) => [['A', g.A, 'a'], ['B', g.B, 'b']].forEach(([lb, p, k]) => {
    const on = moving === k;
    dot(p, 13, on ? P.sel : P.paper, P.sel, 2);
    text(c, lb, X(p.x), Y(p.y) + 0.5, { font: `700 12px ${FONT}`, color: on ? P.paper : P.sel });
  });
  if (tool === 'editar' || tool === 'parede') for (const id in f.v) dot(f.v[id], 3.5, P.paper, P.wall, 1.5);

  // pontas A/B da parede em edição — e da parede onde está a porta/janela em edição
  if (S && S.kind === 'wall') { const w = f.walls.find(x => x.id === S.id); if (w) ends(wallGeom(f, w), S.moveEnd); }
  const opId = S && S.kind === 'op' ? S.id : (G && G.type === 'dragOp' && G.moved ? G.id : null);
  if (opId) { const o = f.ops.find(x => x.id === opId), g = o && opGeom(f, o); if (g) ends(g.g, null); }

  const pill = (s, tx, ty) => {
    c.font = `600 14px ${MONO}`; const w = c.measureText(s).width + 18;
    c.fillStyle = P.sel; c.beginPath(); c.roundRect ? c.roundRect(tx - w / 2, ty - 14, w, 28, 14) : c.rect(tx - w / 2, ty - 14, w, 28); c.fill();
    text(c, s, tx, ty, { font: `600 14px ${MONO}`, color: P.paper });
  };
  const live = (from, to) => {
    c.strokeStyle = P.sel; c.lineWidth = 2; c.setLineDash([8, 6]);
    c.beginPath(); c.moveTo(X(from.x), Y(from.y)); c.lineTo(X(to.x), Y(to.y)); c.stroke(); c.setLineDash([]);
    // fica acima do dedo para não ser coberto
    if (!same(from, to)) pill(fmt(dist(from, to)) + ' m', X(to.x), Y(to.y) - 46);
  };
  const guides = h => {
    c.strokeStyle = P.sel; c.globalAlpha = 0.5; c.lineWidth = 1; c.setLineDash([3, 4]); c.beginPath();
    if (h.ax) { c.moveTo(X(h.ax.x), Y(h.ax.y)); c.lineTo(X(h.x), Y(h.y)); }
    if (h.ay) { c.moveTo(X(h.ay.x), Y(h.ay.y)); c.lineTo(X(h.x), Y(h.y)); }
    c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  };
  const line = (pts, col, w, dash) => { c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(X(q.x), Y(q.y)) : c.moveTo(X(q.x), Y(q.y))); c.stroke(); c.setLineDash([]); };

  if (tool === 'calib' && calib) {
    if (calib.pts.length === 2) line(calib.pts, P.sel, 2.5, [8, 6]);
    calib.pts.forEach(q => { dot(q, 9, null, P.sel, 2.5); dot(q, 2.5, P.sel); });
    return;
  }
  if (!isDraw()) {
    if (tool === 'elementos' && hover) dot(hover, 8, null, P.sel, 2.5);
    return;
  }
  const d = drawing();
  if (amb && amb.mode === 'walls') {
    // contorno pelas paredes: área sugerida preenchida e paredes tocadas em destaque
    const col = P[CATS[amb.cat].col];
    if (amb.cand) { c.globalAlpha = .16; c.fillStyle = col; c.fill(regionPath(amb.cand.pts, X, Y)); c.globalAlpha = 1; line(amb.cand.pts.concat([amb.cand.pts[0]]), col, 2, [7, 5]); }

      const w = f.walls.find(x => x.id === s.id); if (!w) continue;

    }

    const col = P[CATS[amb.cat].col], pts = [pt(amb.pts[0])];

  }

    const s = hover ? pendS(hover) : 0;
    line(s ? arcPts(pend.from, pend.to, s) : [pend.from, pend.to], P.sel, 2.5, [8, 6]);

    return;
  }

    const from = (d && d.pts.length ? d.pts[d.pts.length - 1] : null) || (G && G.type === 'draw' ? G.start : null);
    if (from) live(from, hover);
    dot(hover, 8, null, P.sel, 2.5);
  }
}

let raf = 0;

  if (!doc) return;
  drawScene(ctx, { ox: cam.ox, oy: cam.oy, z: cam.z, W: VW, H: VH }, PAL, { floor: F(), sel, under: underFloor(), fin: tool === 'acab', cam: true, hidFocus: tool === 'hidro' ? hidSys : null });
  drawOverlay(ctx);

  $('#scaleBar').style.width = Math.round(m * cam.z) + 'px';
  $('#scaleTxt').textContent = fmt(m, m < 1 ? 1 : 0) + ' m';
}

/* ================= encaixe na grade ================= */
// tubos: encaixa nos pontos do mesmo sistema, sobre tubos existentes ou na grade de 25 cm

  const f = F(), z = cam.z, w = toWorld(sp), H = f.hid, nodes = [];
  for (const id in H.n) if (H.n[id].sys === hidSys && id !== o.exclude) nodes.push([id, H.n[id]]);
  if (!o.noNode) {

    for (const [id, nd] of nodes) { const d = dist(nd, w) * z; if (d < bd) { bd = d; best = { x: nd.x, y: nd.y, node: id }; } }
    if (best) return best;

function openFinSheet(kind, id, isNew) {
  const f = F(), obj = kind === 'wall' ? f.walls.find(w => w.id === id) : f.rooms.find(r => r.id === id); if (!obj) return;
  sel = { type: kind === 'wall' ? 'wall' : 'room', id };
  const zone = kind !== 'wall' && obj.cat === 'piso', keys = kind === 'wall' ? ['parede'] : finKeys(obj);
  const opts = k => kind === 'wall' ? FIN.parede : finOpts(obj, k);
  const label = k => kind === 'wall' ? 'Revestimento desta parede' : zone ? 'Acabamento do piso nesta área' : obj.cat === 'calcada' ? 'Tipo de calçamento' : obj.cat === 'permeavel' ? 'Cobertura do solo' : FIN_LBL[k];
  const cur = () => obj.fin || {};
  // parede: uma ou mais faixas de acabamento, de baixo (piso = 0) para cima
  const bands = keys.includes('parede') ? bandsOf(cur().parede) : [];
  const writeBands = () => { obj.fin = obj.fin || {}; obj.fin.parede = bands.length > 1 ? bands.map(b => ({ ate: b.ate, v: b.v })) : bands[0].v; };
  const pdRef = kind === 'wall' ? (f.rooms.find(r => hasPD(r) && roomWalls(f, r).includes(obj)) || {}).pd : obj.pd;
  const fields = {};
  bands.forEach((b, i) => { if (i < bands.length - 1) fields['b' + i] = { value: fmt(b.ate), live: v => {
    if (v > 0 && v < 30) { touch(); bands[i].ate = v; writeBands(); save(); render(); checkBands(); const el = $('#bandLo' + (i + 1)); if (el) el.textContent = `de ${fmt(v)} m até`; }
  } }; });
  const checkBands = () => {
    const el = $('#bandMsg'); if (!el) return;
    const bad = bands.some((b, i) => i && b.ate != null && bands[i - 1].ate != null && b.ate <= bands[i - 1].ate) || (pdRef && bands.some(b => b.ate != null && b.ate >= pdRef));
    el.textContent = bad ? `Confira as alturas: cada faixa deve terminar acima da anterior${pdRef ? ` e abaixo do teto (${fmt(pdRef)} m)` : ''}.` : '';
  };
  const bandHTML = () => bands.map((b, i) => {
    const lo = i ? bands[i - 1].ate : 0, top = i === bands.length - 1, bk = `parede.${i}`;
    return `<div class="band"><div class="band-h"><b>${bands.length > 1 ? `Faixa ${i + 1}` : 'Altura toda'}</b>
        ${bands.length > 1 ? `<span class="muted" id="bandLo${i}">de ${fmt(lo ?? 0)} m até</span>${top ? `<b>o teto${pdRef ? ` (${fmt(pdRef)} m)` : ''}</b>` : `<button class="num sm" data-field="b${i}"></button><span class="unit">m</span>`}
          <span class="grow"></span><button class="x" data-act="bdel" data-b="${i}" aria-label="Tirar a faixa ${i + 1}"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}</div>
      ${chipsPick('fin', FIN.parede, b.v, `data-k="${bk}"`)}
      <input class="txt" id="fin-parede-${i}" data-input="fintxt" data-k="${bk}" value="${esc(b.v)}" placeholder="Outro: descreva" autocomplete="off"></div>`;
  }).join('');
  let sub;
  if (kind === 'wall') { const g = wallGeom(f, obj), rs = wallRooms(f, obj); sub = `Parede de ${fmt(g.L)} m${rs.length ? ' · ' + rs.join(' / ') : ''}. Vale só para esta parede, no lugar do acabamento do ambiente.`; }
  else sub = zone ? `${fmt(roomInfo(f, obj).area)} m² · parte do piso com acabamento diferente` : `${roomName(f, obj)} · ${fmt(roomInfo(f, obj).area)} m²`;
  const reopen = () => { const c = S.committed; openFinSheet(kind, id, isNew); S.committed = c; };
  openSheet({
    kind: 'fin', id, title: kind === 'wall' ? 'Acabamento da parede' : zone ? (isNew ? 'Nova área de piso' : 'Área de piso') : 'Acabamentos', sub, fields,
    active: bands.length > 1 ? 'b0' : null,
    body: keys.map(k => k === 'parede' ? `<div class="field"><span class="lbl">${kind === 'wall' ? 'Revestimento desta parede' : 'Parede'} · de baixo para cima (piso = 0)</span>
        ${bandHTML()}
        <span class="small" id="bandMsg" style="color:var(--red)"></span>
        ${bands.length > 1 ? keypad() : ''}
        <div class="row"><button class="btn sm" data-act="badd">+ Faixa acima</button><span class="small muted grow">Ex.: cerâmica até 1,50 m e pintura até o teto.</span></div></div>`
      : `<div class="field"><label class="lbl" for="fin-${k}">${label(k)}</label>
        ${chipsPick('fin', opts(k), cur()[k], `data-k="${k}"`)}
        <input class="txt" id="fin-${k}" data-input="fintxt" data-k="${k}" value="${esc(cur()[k] || '')}" placeholder="Outro: descreva" autocomplete="off"></div>`).join('') +
      (zone ? `<div class="field"><label class="lbl" for="zObs">Observação</label><input class="txt" id="zObs" data-input="zobs" value="${esc(obj.obs || '')}" placeholder="Ex.: piso trincado junto à porta" autocomplete="off"></div>` : '') +
      `<div class="row"><button class="btn primary grow" data-close>Pronto</button>${kind === 'wall' && cur().parede ? '<button class="btn" data-act="clr">Usar o do ambiente</button>' : ''}${zone ? '<button class="btn danger" data-act="del">Excluir área</button>' : ''}</div>`,
    on: {
      fin(el) {
        touch(); obj.fin = obj.fin || {};
        const [k, bi] = el.dataset.k.split('.');
        if (bi != null) { const b = bands[+bi]; b.v = b.v === el.dataset.v ? '' : el.dataset.v; writeBands(); $('#fin-parede-' + bi).value = b.v; markChips('fin', b.v, el.dataset.k); }
        else { const v = obj.fin[k] === el.dataset.v ? '' : el.dataset.v; obj.fin[k] = v; $('#fin-' + k).value = v; markChips('fin', v, k); }
        save(); render();
      },
      fintxt(el) {
        touch(); obj.fin = obj.fin || {};
        const [k, bi] = el.dataset.k.split('.');
        if (bi != null) { bands[+bi].v = el.value; writeBands(); } else obj.fin[k] = el.value;
        markChips('fin', el.value, el.dataset.k); save(); render();
      },
      badd() {
        touch(); const last = bands[bands.length - 1], lo = bands.length > 1 ? bands[bands.length - 2].ate : 0;
        last.ate = Math.round(Math.min((lo || 0) + (bands.length === 1 ? 1.5 : 0.5), (pdRef || 3) - 0.1) * 100) / 100;
        bands.push({ ate: null, v: '' }); writeBands(); save(); render(); reopen();
      },
      bdel(el) {
        touch(); const i = +el.dataset.b; bands.splice(i, 1); bands[bands.length - 1].ate = null;
        writeBands(); save(); render(); reopen();
      },
      zobs(el) { touch(); obj.obs = el.value; save(); },
      clr() { touch(); delete obj.fin; save(); closeSheet(); },
      del() { touch(); const ff = F(); ff.rooms = ff.rooms.filter(x => x.id !== obj.id); cleanup(ff); save(); closeSheet(); }
    }
  });
  checkBands();
}
// ambientes dos dois lados de uma parede (para identificar a parede nos relatórios)

  f.lines = f.lines.filter(x => !ls.includes(x));
}

// bússola do aparelho: direção para onde aponta o alto da tela; o norte fica no sentido contrário a esse giro
async function startCompass() {
  stopCompass();
  const txt = $('#compTxt'), use = $('#compUse');
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  let got = false;
  const on = e => {
    let h = null;
    if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
    else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
    if (h == null || !S || S.kind !== 'north') return;
    got = true;
    const scr = (screen.orientation && screen.orientation.angle) || window.orientation || 0, up = ((h + scr) % 360 + 360) % 360;
    S.compass = (360 - up) % 360;
    txt.textContent = `Norte a ${Math.round(S.compass)}° da vertical da tela`; use.hidden = false;
  };
  window.addEventListener('deviceorientationabsolute', on); window.addEventListener('deviceorientation', on);
  compassStop = () => { window.removeEventListener('deviceorientationabsolute', on); window.removeEventListener('deviceorientation', on); };
  txt.textContent = 'Lendo a bússola…';
  setTimeout(() => { if (!got && S && S.kind === 'north') { txt.textContent = 'A bússola não respondeu neste aparelho. Escolha a direção no círculo.'; stopCompass(); } }, 3000);
}

// Banco do aparelho (IndexedDB). Se o navegador não deixar usar, cai no reserva (memória ou localStorage).
function kvStore(dbName, storeName, fb) {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const q = indexedDB.open(dbName, 1); q.onupgradeneeded = () => q.result.createObjectStore(storeName); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }
    catch (e) { rej(e); }
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(storeName, mode), q = fn(t.objectStore(storeName));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  }));
  return {
    get: id => run('readonly', s => s.get(id)).catch(() => fb.get(id)),
    put: (id, v) => run('readwrite', s => s.put(v, id)).catch(() => fb.put(id, v)),
    del: id => run('readwrite', s => s.delete(id)).catch(() => fb.del(id)),
    keys: () => run('readonly', s => s.getAllKeys()).catch(() => fb.keys()),
    all: () => run('readonly', s => s.getAll()).catch(() => fb.all())
  };
}
function memStore() { const m = new Map(); return { get: k => m.get(k), put: (k, v) => { m.set(k, v); }, del: k => { m.delete(k); }, keys: () => [...m.keys()], all: () => [...m.values()] }; }
function lsStore(prefix) {
  const ks = () => Object.keys(localStorage).filter(k => k.startsWith(prefix)).map(k => k.slice(prefix.length));
  return {
    get: k => { try { const s = localStorage.getItem(prefix + k); return s ? JSON.parse(s) : undefined; } catch (e) { return undefined; } },
    put: (k, v) => { localStorage.setItem(prefix + k, JSON.stringify(v)); },
    del: k => { try { localStorage.removeItem(prefix + k); } catch (e) {} },
    keys: () => { try { return ks(); } catch (e) { return []; } },
    all: () => { try { return ks().map(k => JSON.parse(localStorage.getItem(prefix + k))); } catch (e) { return []; } }
  };
}

async function photoURL(id) {
  if (phURL[id]) return phURL[id];
  const v = await idb.get(id); if (!v) return null;

}
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob: b, w, h }) : rej(new Error('jpeg')), 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

    catch (e) { toast('Não foi possível ler uma das fotos.'); }
  }
  if (!doc) return;
  const f = doc.floors.find(fl => fl.rooms.some(r => r.id === rid)), r = f && f.rooms.find(x => x.id === rid);
  if (!r || !added.length) return;
  if (S && S.kind === 'room' && S.id === rid) touch(); else commit();
  r.photos.push(...added); doc.example = false; save(); render();
  if (S && S.kind === 'room' && S.id === rid) renderPhotos(r);
  toast(added.length > 1 ? `${added.length} fotos adicionadas.` : 'Foto adicionada.');
}

function setTool(t) {

  if (t !== 'calib') calib = null;

function hintHTML() {
  const two = ' <span>Dois dedos movem e dão zoom.</span>';
  if (pend) return '<b>Toque ou arraste para o lado da curva.</b> O raio sai do ponto marcado; dá para digitar o raio medido depois, tocando na parede.';
  if (amb && amb.mode === 'walls') return amb.cand ? '<b>Área sugerida em destaque.</b> Toque em Fechar área para aceitar, ou toque em mais paredes do ambiente para corrigir.'

  switch (tool) {
    case 'editar': return '<b>Toque numa parede</b> para medida, espessura e tipo. Toque em esquadrias, pilares e nomes para editar; arraste vértices, esquadrias e pilares.' + two;
    case 'parede': return `<b>${esc(wtype({ type: wallType }).n)}.</b> ${curve ? 'Modo curva: toque no início, no fim e depois para o lado da curva.' : 'Toque nos pontos da grade (ou arraste de um ponto a outro).'} Toque no 1º ponto para fechar o ambiente.` + two;
    case 'esquadria': return `<b>${esc(OPK[opSel].n)}:</b> toque sobre a parede${OPK[opSel].t === 'porta' && opSel !== 'vao' ? ', do lado para onde ela abre' : ''}.` + two;
    case 'ambiente': return `<b>${esc(CATS[regCat].n)}:</b> toque numa parede do ambiente para contornar pelas paredes, ou toque nos cantos e feche no 1º ponto.${curve ? ' Modo curva ligado.' : ''}` + two;
    case 'elementos': return `<b>${esc(SECS[colSec].n)}:</b> toque onde fica o pilar. Ele encaixa na grade e nos cantos das paredes.` + two;
    case 'acab': return acabMode === 'parede' ? '<b>Toque numa parede</b> para dar a ela um acabamento próprio, em uma ou mais faixas de altura (fica com traço roxo).' + two
      : acabMode === 'area' ? '<b>Área de piso:</b> contorne a parte do piso com acabamento diferente (pelas paredes ou pelos cantos).' + two
      : '<b>Toque dentro de um ambiente</b> para definir piso, parede e teto.' + two;
    case 'nota': return '<b>Toque onde quer escrever</b> uma observação.' + two;
    case 'calib': return `<b>Calibrar o fundo:</b> toque no ${calib && calib.pts.length ? 'fim' : 'início'} de uma medida que você conhece (por exemplo, uma parede cotada). Aproxime com dois dedos para acertar o ponto.`;
    case 'hidro': {

function showHelp() {
  openModal(`<h2>Como usar o croqui</h2>
    <ol class="help">
      <li><b>Entrar e salvar:</b> cada desenhista entra com o próprio PIN e vê só os próprios croquis. Toque no disquete para salvar; ao sair do desenho, o app pergunta se quer salvar. Depois de 5 minutos sem uso, o croqui é salvo e o app volta para a tela do PIN.</li>
      <li><b>Norte:</b> toque na bússola (canto de cima) e indique para que lado fica o norte, ou use a bússola do tablet. Desenhe como for mais natural; na exportação o desenho gira para o norte ficar para cima.</li>
      <li><b>Parede:</b> escolha o tipo pelo ícone e toque nos cruzamentos da grade (0,5 m; linhas fortes a cada 1 m). Toque no primeiro ponto para fechar o ambiente. Para curvas, troque Reta por Curva.</li>
      <li><b>Medida:</b> com Editar, toque na parede e digite a medida real. Só a ponta escolhida (A ou B) anda; a parede paralela não muda.</li>
      <li><b>Esquadrias:</b> escolha porta de abrir, dupla, de correr, vão livre ou o tipo de janela e toque sobre a parede. Centralizar no vão põe a esquadria no meio.</li>
      <li><b>Ambiente:</b> toque numa parede do ambiente e o app sugere o contorno pelas paredes (toque em Fechar área), ou toque nos cantos, um a um. Varanda, calçamento, área permeável e piscina ficam na mesma lista.</li>
      <li><b>Acabamentos:</b> piso, parede e teto do ambiente, de uma parede só ou de uma área de piso. Na parede, use + Faixa acima para, por exemplo, cerâmica até 1,50 m e pintura até o teto.</li>
      <li><b>Hidrossanitário:</b> escolha Esgoto (verde) ou Drenagem (roxo). Na barra de baixo: Tubulação (no sentido do fluxo, com o diâmetro), Caixas e conexões (toque num encontro de tubos para ver o que pode existir ali), Ponto de contribuição (banheiro, cozinha…) e Selecionar. Fechar volta ao desenho normal.</li>
      <li><b>Desenho pronto:</b> na lista de croquis, Importar desenho (ou no menu ⋮ do desenho). DXF: as linhas vêm editáveis (excluir ou transformar em parede) e os textos viram notas. PDF e imagem: ficam de fundo em escala; marque uma medida conhecida para calibrar e desenhe por cima. O JSON exportado pelo app volta completo.</li>
      <li><b>Quantitativos:</b> menu ⋮ → Quantitativos (ou em Ambientes). Pisos, revestimento de paredes por faixa, tetos, rodapé, paredes por tipo, esquadrias, pilares, piscina e instalações, descontando portas e janelas. A planilha CSV abre no Excel com colunas de preço unitário e total.</li>
      <li><b>Fotos:</b> no painel do ambiente, Tirar foto ou Da galeria. Elas saem só no PDF.</li>
      <li><b>Exportar:</b> PNG para a ficha, PDF com croqui, tabela e fotos, DXF para o CAD e JSON com os dados.</li>
    </ol>
    <p class="small muted" style="margin:0">Os croquis e as fotos ficam salvos só neste aparelho.</p>
    <div class="row"><span class="grow"></span><button class="btn primary" data-mact="close">Entendi</button></div>`);
}

  c.save(); c.translate(x, y); c.rotate(ang * Math.PI / 180);
  c.fillStyle = c.strokeStyle = col; c.lineWidth = r * .09; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(0, -r); c.lineTo(r * .42, r * .1); c.lineTo(-r * .42, r * .1); c.closePath(); c.fill();

}

// desenho do pavimento num quadro de W×H px, sem carimbo

  const bw = b.x1 - b.x0 + 2.4, bh = b.y1 - b.y0 + 2.4, z = Math.min(110, 3600 / Math.max(bw, bh)), fs = Math.max(1, z / 65);

  text(x, `${autorLine()} · ${areaLine(f)}`, 16 * fs, Hd + 45 * fs, { font: `500 ${12 * fs}px ${FONT}`, color: '#17212B', align: 'left' });

function buildDXF(o = { k: 0, hid: true }) {

        <span class="small muted">Horizontal ou vertical: o fundo gira um pouco para essa linha ficar alinhada com a grade.</span></div>
      <div class="row"><button class="btn" data-act="redo">Marcar de novo</button><span class="grow"></span><button class="btn primary" data-act="apply">Aplicar</button></div>`,
    on: {

      }
    }
  } finally { if (lg) lg.busy = false; }
}
// o desenho salvo pela versão anterior (antes do login) passa a ser um croqui do primeiro administrador
async function importOld() {
  try {
    const s = localStorage.getItem(KEY); if (!s) return;
    const d = JSON.parse(s);
    if (d && d.floors && d.floors.length && !d.example) {
      migrate(d);
      const rec = { id: uid() + uid(), owner: me.id, created: Date.now(), updated: Date.now(), updatedBy: me.id, ficha: d.ficha, title: d.title, data: d.data, doc: d };
      await CRO.put(rec.id, rec);
    }
    localStorage.removeItem(KEY);
  } catch (e) {}
}
async function afterLogin(resumed) {
  const ses = resumed ? readSession() : null;
  lg = null; writeSession();
  // alterações não salvas (o app fechou sem salvar): o croqui volta aberto com elas
  const dr = await Promise.resolve(CRO.get('rascunho-' + me.id)).catch(() => null);
  if (dr && dr.cid && dr.doc) {
    const rec = (await Promise.resolve(CRO.get(dr.cid)).catch(() => null)) || { id: dr.cid, owner: me.id, created: dr.t };
    openCroqui(rec, dr.doc, true);
    if (!resumed) toast('Recuperamos alterações não salvas deste croqui. Toque no disquete para salvar.');
    return;
  }
  if (ses && ses.cid) { const rec = await Promise.resolve(CRO.get(ses.cid)).catch(() => null); if (rec && rec.doc) { openCroqui(rec); return; } }
  showHome();
}

/* ---------- lista de croquis do desenhista ---------- */
let homeFilter = 'meus';
function showHome() {
  showScreen('home');
  $('#hWho').textContent = `${me.nome}${me.admin ? ' · administrador' : ''}`;
  $('#hUsers').hidden = !me.admin; $('#hFilter').hidden = !me.admin;
  if (!me.admin) homeFilter = 'meus';
  renderHome(); photoGC();
}
const whenTxt = t => {
  const d = new Date(t), now = new Date(), hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return d.toDateString() === now.toDateString() ? `hoje às ${hm}` : `em ${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} às ${hm}`;
};
async function renderHome() {
  if (!me) return;
  const all = ((await Promise.resolve(CRO.all()).catch(() => [])) || []).filter(r => r && r.id && r.owner && r.doc);
  const q = norm($('#hSearch').value), todos = me.admin && homeFilter === 'todos';
  const list = all.filter(r => todos || r.owner === me.id)
    .filter(r => !q || norm(`${r.ficha} ${r.title} ${r.doc.desenhista} ${userName(r.owner)}`).includes(q))
    .sort((a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0));
  $('#hTitle').textContent = todos ? 'Todos os croquis' : 'Meus croquis';
  const el = $('#hList');
  if (!list.length) { el.innerHTML = `<div class="empty">${q ? 'Nenhum croqui encontrado.' : 'Nenhum croqui salvo ainda. Toque em Novo croqui para começar.'}</div>`; return; }
  el.innerHTML = list.map(r => {
    const nf = r.doc.floors.length, nr = r.doc.floors.reduce((s, f) => s + f.rooms.filter(x => x.cat !== 'piso').length, 0);
    return `<div class="card"><button class="card-main" data-open="${r.id}"><span class="th"><canvas data-th="${r.id}" width="208" height="176"></canvas></span>
      <span class="ct"><b>${r.ficha ? 'Ficha nº ' + esc(r.ficha) : 'Sem nº de ficha'}</b><span class="d">${esc(r.title || 'Sem descrição')}</span>
        <span>${esc(brDate(r.data) || '—')} · ${nf} pavimento${nf > 1 ? 's' : ''} · ${nr} ambiente${nr === 1 ? '' : 's'}</span>
        <span>Salvo ${whenTxt(r.updated || r.created)}${todos || r.updatedBy !== r.owner ? ` por ${esc(userName(r.updatedBy || r.owner))}` : ''}</span></span></button>
      <button class="x" data-del="${r.id}" aria-label="Excluir croqui"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></div>`;
  }).join('');
  list.forEach(r => { const c = el.querySelector(`[data-th="${r.id}"]`); if (c) drawThumb(c, r.doc); });
}
function drawThumb(cvs, d) {
  try {
    const f = [d.floors[d.cur || 0], ...d.floors].find(x => x && bounds(x)); if (!f) return;
    const b = bounds(f), W = cvs.width, H = cvs.height, z = Math.min(W / (b.x1 - b.x0 + 1), H / (b.y1 - b.y0 + 1));
    NOTEXT = true;
    drawScene(cvs.getContext('2d'), { ox: W / 2 - (b.x0 + b.x1) / 2 * z, oy: H / 2 - (b.y0 + b.y1) / 2 * z, z, W, H }, LIGHT, { floor: f, grid: false, fs: .6 });
  } catch (e) {} finally { NOTEXT = false; }
}
$('#hList').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]'); if (del) { confirmDelete(del.dataset.del); return; }
  const op = e.target.closest('[data-open]'); if (!op) return;
  const rec = await Promise.resolve(CRO.get(op.dataset.open)).catch(() => null);
  if (rec && rec.doc) openCroqui(rec); else toast('Não foi possível abrir este croqui.');
});
$('#hSearch').addEventListener('input', renderHome);
$('#hFilter').addEventListener('click', e => {
  const b = e.target.closest('[data-hf]'); if (!b) return;
  homeFilter = b.dataset.hf; $('#hFilter').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderHome();
});
$('#hNew').addEventListener('click', () => newCroqui(false));
$('#hExample').addEventListener('click', () => newCroqui(true));
$('#hOut').addEventListener('click', () => logout());
$('#hUsers').addEventListener('click', () => openUsers());
$('#hPin').addEventListener('click', () => openPinChange(me.id));
async function confirmDelete(id) {
  const r = await Promise.resolve(CRO.get(id)).catch(() => null); if (!r) return;
  openModal(`<h2>Excluir o croqui?</h2>
    <p style="margin:0;font-size:14.5px;line-height:1.5">${r.ficha ? `Ficha nº <b>${esc(r.ficha)}</b>` : 'Croqui sem nº de ficha'}${r.title ? ` — ${esc(r.title)}` : ''}. Apaga o desenho e as fotos dele deste aparelho. Não dá para desfazer.</p>
    <div class="row"><span class="grow"></span><button class="btn" data-mact="close">Cancelar</button><button class="btn danger-solid" data-mact="ok">Excluir croqui</button></div>`, {
    async ok() {
      await CRO.del(id);
      for (const u of users) { const dr = await Promise.resolve(CRO.get('rascunho-' + u.id)).catch(() => null); if (dr && dr.cid === id) await CRO.del('rascunho-' + u.id); }
      closeModal(); toast('Croqui excluído.'); renderHome(); photoGC();
    }
  });
}

/* ---------- usuários (administrador) ---------- */
const pinOk = s => /^\d{4}$/.test(s);
function openUsers() {
  if (!me || !me.admin) return;
  const rows = users.map(u => `<div class="urow"><span class="av sm">${esc(initials(u.nome))}</span>
      <div><b>${esc(u.nome)}${u.admin ? '<span class="badge">Administrador</span>' : ''}</b><span>${u.id === me.id ? 'Você' : 'Cadastrado em ' + new Date(u.criado).toLocaleDateString('pt-BR')}</span></div>
      <button class="btn sm" data-mact="pin" data-u="${u.id}">Trocar PIN</button>
      ${u.id !== me.id ? `<button class="btn sm" data-mact="adm" data-u="${u.id}">${u.admin ? 'Tirar administrador' : 'Tornar administrador'}</button>
        <button class="btn sm danger" data-mact="rm" data-u="${u.id}">Excluir</button>` : ''}</div>`).join('');
  openModal(`<h2>Usuários deste tablet</h2><div class="ulist">${rows}</div>
    <div class="divider"></div>
    <h2 style="font-size:16px">Cadastrar desenhista</h2>
    <div class="form-grid">
      <div class="field"><label class="lbl" for="nuName">Nome</label><input class="txt" id="nuName" autocomplete="off" placeholder="Nome do desenhista"></div>
      <div class="field"><label class="lbl" for="nuPin">PIN (4 números)</label><input class="txt" id="nuPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••"></div>
      <label class="row small span2"><input type="checkbox" id="nuAdm"> Também é administrador (cadastra e gerencia usuários)</label></div>
    <div class="row"><span class="grow"></span><button class="btn" data-mact="close">Fechar</button><button class="btn primary" data-mact="add">Cadastrar</button></div>`, {
    async add() {
      const nome = $('#nuName').value.trim(), pin = $('#nuPin').value.trim();
      if (!nome) { toast('Escreva o nome.'); return; }
      if (users.some(u => norm(u.nome) === norm(nome))) { toast('Já existe um usuário com esse nome.'); return; }
      if (!pinOk(pin)) { toast('O PIN precisa ter 4 números.'); return; }
      const u = { id: uid() + uid(), nome, admin: $('#nuAdm').checked, criado: Date.now() };
      u.pin = await pinHash(u.id, pin); users.push(u); saveUsers(); toast(`${nome} cadastrado.`); openUsers();
    },
    adm(b) {
      const u = users.find(x => x.id === b.dataset.u); if (!u) return;
      if (u.admin && users.filter(x => x.admin).length === 1) { toast('Precisa ficar pelo menos um administrador.'); return; }
      u.admin = !u.admin; saveUsers(); openUsers();
    },
    pin(b) { openPinChange(b.dataset.u, true); },
    rm(b) { confirmRemoveUser(b.dataset.u); }
  });
}
function openPinChange(id, fromUsers) {
  const u = users.find(x => x.id === id); if (!u) return;
  openModal(`<h2>${u.id === me.id ? 'Trocar meu PIN' : `Trocar o PIN de ${esc(u.nome)}`}</h2>
    <div class="form-grid">
      <div class="field"><label class="lbl" for="np1">Novo PIN</label><input class="txt" id="np1" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••"></div>
      <div class="field"><label class="lbl" for="np2">Repita o PIN</label><input class="txt" id="np2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••"></div></div>
    <div class="row"><span class="grow"></span><button class="btn" data-mact="${fromUsers ? 'back' : 'close'}">Cancelar</button><button class="btn primary" data-mact="ok">Salvar PIN</button></div>`, {
    async ok() {
      const a = $('#np1').value.trim(), b = $('#np2').value.trim();
      if (!pinOk(a)) { toast('O PIN precisa ter 4 números.'); return; }
      if (a !== b) { toast('Os PINs não conferem.'); return; }
      u.pin = await pinHash(u.id, a); saveUsers(); toast('PIN trocado.');
      if (fromUsers) openUsers(); else closeModal();
    },
    back() { openUsers(); }
  });
  setTimeout(() => $('#np1') && $('#np1').focus(), 50);
}
function confirmRemoveUser(id) {
  const u = users.find(x => x.id === id); if (!u) return;
  openModal(`<h2>Excluir ${esc(u.nome)}?</h2>
    <p style="margin:0;font-size:14.5px;line-height:1.5">${esc(u.nome)} não poderá mais entrar. Os croquis dele continuam no tablet e passam para a sua lista.</p>
    <div class="row"><span class="grow"></span><button class="btn" data-mact="back">Cancelar</button><button class="btn danger-solid" data-mact="ok">Excluir usuário</button></div>`, {
    async ok() {
      const all = ((await Promise.resolve(CRO.all()).catch(() => [])) || []).filter(r => r && r.id && r.owner === id);
      for (const r of all) { r.owner = me.id; await CRO.put(r.id, r); }
      await Promise.resolve(CRO.del('rascunho-' + id)).catch(() => {});
      users = users.filter(x => x.id !== id); saveUsers(); toast(`${u.nome} excluído.`); openUsers(); renderHome();
    },
    back() { openUsers(); }
  });
}

/* ================= início ================= */
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bSave').addEventListener('click', () => saveCroqui());
$('#zIn').addEventListener('click', () => zoomAt(1.25));
$('#zOut').addEventListener('click', () => zoomAt(0.8));
$('#zFit').addEventListener('click', fit);
$('#bBack').addEventListener('click', () => leaveDrawing(showHome));
document.addEventListener('keydown', e => {
  if (!doc || !$('#login').hidden || !$('#home').hidden || e.target.closest('input, textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveCroqui(); }
  else if (e.key === 'Escape') {
    if (!$('#picker').hidden) closePicker();
    else if (pend) { pend = null; refresh(); }
    else if (chain || amb || hchain) { chain = amb = hchain = null; refresh(); }
    else if (S) closeSheet();
  }
});
// se o app for fechado no meio do desenho, o rascunho é gravado na hora (volta aberto na próxima entrada)
window.addEventListener('pagehide', () => { clearTimeout(saveT); writeDraft(); writeSession(); });

readPalette();
mq.addEventListener && mq.addEventListener('change', () => { readPalette(); themeIcon(); });
new MutationObserver(() => { readPalette(); themeIcon(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(resize).observe(stage);
document.fonts && document.fonts.ready.then(render);
(async function boot() {
  loadUsers();
  const ses = readSession(), u = ses && users.find(x => x.id === ses.uid);
  if (u && Date.now() - ses.t < IDLE) { me = u; lastAct = ses.t; await afterLogin(true); }
  // sessão vencida: o rascunho (se houver) volta quando a pessoa entrar de novo
  else showLogin(u ? 'Sessão encerrada depois de 5 minutos sem uso.' : '');
})();
</script>

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
